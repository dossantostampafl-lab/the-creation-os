# Cloud server overlay: HTTPS through Caddy on ports 80/443 instead of plain HTTP on 8080,
# and the hardening a server on the public internet needs — a read-only filesystem, no new
# privileges, and the database and Redis on a network the internet-facing containers reach
# but that has no route out.
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build
# CREATION_DOMAIN (in .env) is the public name, e.g. 129-146-10-20.sslip.io or a DuckDNS name.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true

services:
  frontend:
    # Only Caddy talks to the frontend; nothing is published directly.
    ports: !reset []
    <<: *hardening
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  api:
    <<: *hardening
    tmpfs:
      - /tmp
    # The API keeps its loopback port and its route to the host. Both are load-bearing: the
    # installer waits on 127.0.0.1:8000 and creates the Creator through it, and a FreeLLMAPI
    # running on this server is reached at host.docker.internal, which install.sh opens the
    # firewall for. The port is published on loopback only, so it is not exposed to the
    # internet — Caddy stays the only way in from outside.
    networks:
      - tco_net
      - tco_internal

  worker:
    <<: *hardening
    tmpfs:
      - /tmp
    networks:
      - tco_net
      - tco_internal

  postgres:
    security_opt:
      - no-new-privileges:true
    # Keep the base tco_net attachment as well as the isolated data network.
    # The API starts Alembic before Uvicorn and must be able to resolve the
    # Compose service name "postgres" immediately during startup. Removing the
    # base network here made cloud startup depend on cross-network DNS state and
    # produced asyncpg/socket.gaierror restart loops on Oracle deployments.
    networks:
      - tco_net
      - tco_internal

  redis:
    <<: *hardening
    tmpfs:
      - /tmp
    # Same topology as API/worker so both service names remain resolvable while
    # the data services are still unpublished to the host/internet.
    networks:
      - tco_net
      - tco_internal

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      CREATION_DOMAIN: ${CREATION_DOMAIN:?set CREATION_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - tco_net

volumes:
  caddy_data:
  caddy_config:

networks:
  # No route to the internet: only the containers attached to it talk to the database and Redis.
  tco_internal:
    internal: true
