server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is expected to terminate in front of this container (reverse proxy / load balancer);
    # add Strict-Transport-Security there once that's in place.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
    # connect-src allows https: for production (VITE_API_BASE_URL must point at an https backend
    # there) plus the exact local docker-compose API origin baked into VITE_API_BASE_URL at build
    # time by default (http://127.0.0.1:8000) — without it the browser blocks every API call and
    # the Creator can never log in against the stack's own default configuration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:8000 https:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
