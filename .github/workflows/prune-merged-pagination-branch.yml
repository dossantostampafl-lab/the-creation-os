name: Prune merged pagination branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-pagination-branch.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact merged refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feat/bounded-system-state"
          encoded="${branch//\//%2F}"
          actual="$(gh api "repos/$REPOSITORY/git/ref/heads/$encoded" --jq .object.sha)"
          test "$actual" = "2ddc800e76bf509e4ae13ba0a46e8e477aa91982"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/chore%2Fprune-merged-pagination-branch"
