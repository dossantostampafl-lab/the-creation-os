name: Generate dependency locks once

on:
  push:
    branches: [fix/reproducible-dependency-locks]
    paths:
      - .github/workflows/generate-locks-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Python 3.12 constraints
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip list --format=freeze \
            | grep -v '^the-creation-os==' \
            | LC_ALL=C sort > constraints-py312.txt
      - name: Commit generated locks and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/generate-locks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/constraints-py312.txt .github/workflows/generate-locks-once.yml
          git diff --cached --check
          git commit -m "build: lock frontend and Python dependency resolution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
