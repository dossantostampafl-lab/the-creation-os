name: Deploy
permissions:
  contents: read
concurrency:
  group: deploy-oracle
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Get the repository
      uses: actions/checkout@v5
    - name: Check the inputs and the configured secrets
      shell: bash
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        REF: ${{ inputs.ref }}
        FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      run: "set -euo pipefail\nmissing=\"\"\n[ -n \"${SSH_KEY:-}\" ] || missing=\"\
        $missing DEPLOY_SSH_KEY\"\n[ -n \"${HOST:-}\" ] || missing=\"$missing DEPLOY_HOST\"\
        \nif [ -n \"$missing\" ]; then\n  echo \"::error::Missing repository secret(s):$missing.\
        \ Add them under\" \\\n       \"Settings -> Secrets and variables -> Actions\
        \ -> New repository secret.\"\n  exit 1\nfi\n# The ref is typed by whoever\
        \ runs this and ends up inside a command the server runs,\n# so it is held\
        \ to the characters a git ref may contain and nothing else.\n# A bash match,\
        \ not a grep. grep would get this wrong twice: an empty ref emits no\n# line\
        \ at all, so nothing matches and the workflow's own default is rejected; and\n\
        # grep matches line by line, so a ref carrying a newline passes on its first\
        \ line\n# while the rest travels on to the server's shell.\nif ! [[ \"${REF:-}\"\
        \ =~ ^[A-Za-z0-9._/-]*$ ]]; then\n  echo \"::error::The ref may only contain\
        \ letters, digits, dot, underscore, slash and dash.\"\n  exit 1\nfi\n# These\
        \ two reach the server inside a quoted command line, so they are held to the\n\
        # characters a model name and an address may contain, and nothing else.\n\
        if ! [[ \"${FREELLMAPI_MODEL:-}\" =~ ^[A-Za-z0-9._:/-]*$ ]]; then\n  echo\
        \ \"::error::FREELLMAPI_MODEL may only contain letters, digits, dot, underscore,\
        \ colon, slash and dash.\"\n  exit 1\nfi\nif ! [[ \"${FREELLMAPI_BASE_URL:-}\"\
        \ =~ ^(https?://[A-Za-z0-9._:/-]+)?$ ]]; then\n  echo \"::error::FREELLMAPI_BASE_URL\
        \ must be an http(s) address without spaces, quotes or credentials.\"\n  exit\
        \ 1\nfi\n"
    - name: Open an SSH session to the server
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      run: "set -euo pipefail\nmkdir -m 700 -p ~/.ssh\n# printf, not echo: the key\
        \ is written verbatim or not at all.\nprintf '%s\\n' \"$SSH_KEY\" > ~/.ssh/id_deploy\n\
        chmod 600 ~/.ssh/id_deploy\nif [ -n \"${HOST_KEY:-}\" ]; then\n  # A secret\
        \ overrides, for a server whose keys the repository does not carry.\n  printf\
        \ '%s\\n' \"$HOST_KEY\" > ~/.ssh/known_hosts\n  echo \"The host key is pinned\
        \ by the DEPLOY_SSH_HOST_KEY secret.\"\nelif [ -s deploy/oracle/known_hosts\
        \ ]; then\n  # The normal case. A host key is public, so it lives in the repository,\
        \ where it\n  # can be read back and reviewed -- unlike a secret, which nobody\
        \ can check again.\n  cp deploy/oracle/known_hosts ~/.ssh/known_hosts\n  echo\
        \ \"The host key is pinned by deploy/oracle/known_hosts.\"\nelse\n  # Nothing\
        \ to pin against. Trust on first use, and say so.\n  ssh-keyscan -T 10 \"\
        $HOST\" > ~/.ssh/known_hosts 2>/dev/null\n  echo \"::warning::No pinned host\
        \ key, so this run trusted whatever answered.\"\n  echo \"Record the lines\
        \ below in deploy/oracle/known_hosts:\"\n  cat ~/.ssh/known_hosts\nfi\nchmod\
        \ 600 ~/.ssh/known_hosts\n"
    - name: Probe actual voice inference providers without logging credentials
      env:
        HOST: ${{ secrets.DEPLOY_HOST }}
        USERNAME: ${{ secrets.DEPLOY_USER }}
      run: "set -euo pipefail\nssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20\
        \ \"${USERNAME:-ubuntu}@$HOST\" 'bash -s' <<'REMOTEPROBE'\nset -euo pipefail\n\
        api=\"$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format\
        \ '{{.ID}}' | head -1)\"\nsudo docker exec -i \"$api\" python - <<'PROVIDERPY'\n\
        import asyncio,json,time\nfrom app.voice_session.runtime import build_primary_provider,build_klaus_provider\n\
        from app.inference.bootstrap import build_model_router,resolve_configured_model\n\
        from app.inference.contracts import InferenceRequest\nfrom app.services.conversation_context\
        \ import SYSTEM_PROMPT\nasync def main():\n primary=build_primary_provider();resolved=resolve_configured_model(build_model_router())\n\
        \ request=InferenceRequest(messages=[{'role':'system','content':SYSTEM_PROMPT},{'role':'user','content':'Quanto\
        \ \xE9 dez mais cinco? Responda somente com o n\xFAmero.'}])\n for label,provider,model\
        \ in [('primary-default',primary,None),('primary-resolved',primary,resolved),('klaus-default',build_klaus_provider(),None)]:\n\
        \  started=time.monotonic();iterator=provider.stream(request.model_copy(update={'model':model})).__aiter__()\n\
        \  try:\n   first=await asyncio.wait_for(iterator.__anext__(),timeout=15)\n\
        \   print(json.dumps({'probe':label,'request_model':model,'first_ms':round((time.monotonic()-started)*1000),'first_text':first}),flush=True)\n\
        \  except Exception as error:\n   print(json.dumps({'probe':label,'request_model':model,'elapsed_ms':round((time.monotonic()-started)*1000),'error_type':type(error).__name__,'code':getattr(error,'code',None),'provider':getattr(error,'provider',None)}),flush=True)\n\
        \  finally:\n   try:await asyncio.wait_for(iterator.aclose(),timeout=2)\n\
        \   except Exception:pass\n try:\n  async with primary._client() as client:\n\
        \   response=await client.post(primary._base_url+'/chat/completions',json=primary._request_payload(request,stream=True))\n\
        \  print(json.dumps({'probe':'raw-stream-contract','status':response.status_code,'content_type':response.headers.get('content-type'),'data_prefix':response.text.lstrip().startswith('data:')}),flush=True)\n\
        \ except Exception as error:print(json.dumps({'probe':'raw-stream-contract','error_type':type(error).__name__}),flush=True)\n\
        asyncio.run(main())\nPROVIDERPY\nREMOTEPROBE\n"
    - name: Remove the key
      if: always()
      run: rm -f ~/.ssh/id_deploy
'on':
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the server
        type: choice
        required: true
        default: check
        options:
        - check
        - restart
        - update
        - set-inference
        - set-inference-freellmapi
        - set-creator-password
        - tidy
        - logs
        - set-voice
        - smoke-test
        - stf-host-check
        - seed
      ref:
        description: Branch or tag to take the code from. Empty means the default
          branch.
        type: string
        required: false
        default: ''
