name: Deploy
permissions:
  contents: read
concurrency:
  group: public-voice-verification
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Get the repository
      uses: actions/checkout@v5
    - name: Check the inputs and the configured secrets
      shell: bash
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        REF: ${{ inputs.ref }}
        FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      run: "set -euo pipefail\nmissing=\"\"\n[ -n \"${SSH_KEY:-}\" ] || missing=\"\
        $missing DEPLOY_SSH_KEY\"\n[ -n \"${HOST:-}\" ] || missing=\"$missing DEPLOY_HOST\"\
        \nif [ -n \"$missing\" ]; then\n  echo \"::error::Missing repository secret(s):$missing.\
        \ Add them under\" \\\n       \"Settings -> Secrets and variables -> Actions\
        \ -> New repository secret.\"\n  exit 1\nfi\n# The ref is typed by whoever\
        \ runs this and ends up inside a command the server runs,\n# so it is held\
        \ to the characters a git ref may contain and nothing else.\n# A bash match,\
        \ not a grep. grep would get this wrong twice: an empty ref emits no\n# line\
        \ at all, so nothing matches and the workflow's own default is rejected; and\n\
        # grep matches line by line, so a ref carrying a newline passes on its first\
        \ line\n# while the rest travels on to the server's shell.\nif ! [[ \"${REF:-}\"\
        \ =~ ^[A-Za-z0-9._/-]*$ ]]; then\n  echo \"::error::The ref may only contain\
        \ letters, digits, dot, underscore, slash and dash.\"\n  exit 1\nfi\n# These\
        \ two reach the server inside a quoted command line, so they are held to the\n\
        # characters a model name and an address may contain, and nothing else.\n\
        if ! [[ \"${FREELLMAPI_MODEL:-}\" =~ ^[A-Za-z0-9._:/-]*$ ]]; then\n  echo\
        \ \"::error::FREELLMAPI_MODEL may only contain letters, digits, dot, underscore,\
        \ colon, slash and dash.\"\n  exit 1\nfi\nif ! [[ \"${FREELLMAPI_BASE_URL:-}\"\
        \ =~ ^(https?://[A-Za-z0-9._:/-]+)?$ ]]; then\n  echo \"::error::FREELLMAPI_BASE_URL\
        \ must be an http(s) address without spaces, quotes or credentials.\"\n  exit\
        \ 1\nfi\n"
    - name: Open an SSH session to the server
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      run: "set -euo pipefail\nmkdir -m 700 -p ~/.ssh\n# printf, not echo: the key\
        \ is written verbatim or not at all.\nprintf '%s\\n' \"$SSH_KEY\" > ~/.ssh/id_deploy\n\
        chmod 600 ~/.ssh/id_deploy\nif [ -n \"${HOST_KEY:-}\" ]; then\n  # A secret\
        \ overrides, for a server whose keys the repository does not carry.\n  printf\
        \ '%s\\n' \"$HOST_KEY\" > ~/.ssh/known_hosts\n  echo \"The host key is pinned\
        \ by the DEPLOY_SSH_HOST_KEY secret.\"\nelif [ -s deploy/oracle/known_hosts\
        \ ]; then\n  # The normal case. A host key is public, so it lives in the repository,\
        \ where it\n  # can be read back and reviewed -- unlike a secret, which nobody\
        \ can check again.\n  cp deploy/oracle/known_hosts ~/.ssh/known_hosts\n  echo\
        \ \"The host key is pinned by deploy/oracle/known_hosts.\"\nelse\n  # Nothing\
        \ to pin against. Trust on first use, and say so.\n  ssh-keyscan -T 10 \"\
        $HOST\" > ~/.ssh/known_hosts 2>/dev/null\n  echo \"::warning::No pinned host\
        \ key, so this run trusted whatever answered.\"\n  echo \"Record the lines\
        \ below in deploy/oracle/known_hosts:\"\n  cat ~/.ssh/known_hosts\nfi\nchmod\
        \ 600 ~/.ssh/known_hosts\n"
    - name: Install diagnostic browser
      run: 'cd frontend

        npm ci

        npx playwright install chromium'
    - name: Read ephemeral session and synthetic microphone privately
      env:
        HOST: ${{ secrets.DEPLOY_HOST }}
        USERNAME: ${{ secrets.DEPLOY_USER }}
      run: "set -euo pipefail\numask 077\nssh -i ~/.ssh/id_deploy -o BatchMode=yes\
        \ -o ConnectTimeout=20 \"${USERNAME:-ubuntu}@$HOST\" 'bash -s' > \"$RUNNER_TEMP/creation-session.json\"\
        \ <<'REMOTE'\nset -euo pipefail\napi=\"$(sudo docker ps --filter 'label=com.docker.compose.service=api'\
        \ --format '{{.ID}}' | head -1)\"\nsudo docker exec -i \"$api\" python - <<'PYREMOTE'\n\
        import os,json,httpx,asyncio,base64,io,wave\nimport numpy as np\nfrom app.voice_session.local\
        \ import get_local_engine\nfrom app.config import settings\nassert settings.deus_voice_engine=='local'\
        \ and not settings.elevenlabs_enabled\nassert settings.llm_provider=='freellmapi'\
        \ and not settings.llm_fallback_providers\nwith httpx.Client(timeout=30) as\
        \ c:\n r=c.post('http://127.0.0.1:8000/api/v1/auth/login',json={'username':os.getenv('CREATOR_BOOTSTRAP_USERNAME',''),'password':os.getenv('CREATOR_BOOTSTRAP_PASSWORD','')})\n\
        \ if r.status_code != 200: raise SystemExit('Diagnostic authentication rejected')\n\
        \ tokens=r.json()\nasync def make_audio():\n engine=await get_local_engine()\n\
        \ return await engine.synthesize('Deus, quanto \xE9 dois mais dois?')\npcm=np.frombuffer(asyncio.run(make_audio()),dtype='<i2')\n\
        upsampled=np.interp(np.arange(len(pcm)*2)/2,np.arange(len(pcm)),pcm).astype('<i2')\n\
        # Quiet padding gives startup time and avoids repeating the question during\
        \ playback.\nfixture=np.concatenate([np.zeros(48000,dtype='<i2'),upsampled,np.zeros(48000*10,dtype='<i2')])\n\
        buf=io.BytesIO()\nwith wave.open(buf,'wb') as wav:\n wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(48000);wav.writeframes(fixture.tobytes())\n\
        tokens['wav_base64']=base64.b64encode(buf.getvalue()).decode()\nprint(json.dumps(tokens))\n\
        PYREMOTE\nREMOTE\n"
    - name: Verify actual public voice and typed chat on desktop and phone
      run: "cat > frontend/local-voice-diagnostic.mjs <<'JSDIAGNOSTIC'\nimport { chromium\
        \ } from 'playwright';\nimport { readFileSync, writeFileSync, unlinkSync }\
        \ from 'node:fs';\nconst folder=process.env.RUNNER_TEMP;\nconst tokens=JSON.parse(readFileSync(folder+'/creation-session.json','utf8'));\n\
        unlinkSync(folder+'/creation-session.json');\nconst fixture=folder+'/creation-voice-input.wav';\n\
        writeFileSync(fixture,Buffer.from(tokens.wav_base64,'base64'),{mode:0o600});delete\
        \ tokens.wav_base64;\nconst origin='https://148-116-109-255.sslip.io';\nconst\
        \ browser=await chromium.launch({args:['--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--use-file-for-fake-audio-capture='+fixture]});\n\
        try {\n for (const mobile of [false,true]) {\n  const context=await browser.newContext({permissions:['microphone'],...(mobile?{viewport:{width:390,height:844},isMobile:true,hasTouch:true}:{})});\n\
        \  const auth={Authorization:'Bearer '+tokens.access_token};\n  const created=await\
        \ context.request.post(origin+'/api/v1/conversations',{headers:auth,data:{title:'Local\
        \ voice verification '+(mobile?'phone':'desktop')}});\n  if(created.status()!==201)throw\
        \ new Error('Test conversation creation failed: '+created.status());\n  const\
        \ conversation=await created.json();\n  await context.addInitScript(({access,refresh,conversationId})=>{\n\
        \   localStorage.setItem('creation_access_token',access);sessionStorage.setItem('creation_refresh_token',refresh);localStorage.setItem('creation_conversation_id',conversationId);\n\
        \   window.__voicePlayback={starts:0,nonSilent:0,running:0};\n   const original=AudioBufferSourceNode.prototype.start;\n\
        \   AudioBufferSourceNode.prototype.start=function(...args){\n    window.__voicePlayback.starts++;\n\
        \    if(this.context.state==='running')window.__voicePlayback.running++;\n\
        \    if(this.buffer&&this.buffer.getChannelData(0).some(v=>Math.abs(v)>.001))window.__voicePlayback.nonSilent++;\n\
        \    return original.apply(this,args);\n   };\n  },{access:tokens.access_token,refresh:tokens.refresh_token,conversationId:conversation.id});\n\
        \  const page=await context.newPage();const failures=[];const errors=[];const\
        \ events=[];let lastVoicedAt=0;\n  page.on('pageerror',e=>errors.push(e.message));\n\
        \  page.on('requestfailed',r=>{if(!r.failure()?.errorText.includes('ERR_ABORTED'))failures.push({path:new\
        \ URL(r.url()).pathname,error:r.failure()?.errorText})});\n  page.on('response',r=>{if(r.status()>=400)failures.push({path:new\
        \ URL(r.url()).pathname,status:r.status()})});\n  page.on('websocket',ws=>{\n\
        \   ws.on('framesent',frame=>{try{\n    const event=JSON.parse(frame.payload.toString());\n\
        \    if(event.type==='audio'){const pcm=Buffer.from(event.audio_base64,'base64');let\
        \ energy=0;for(let i=0;i+1<pcm.length;i+=2){const v=pcm.readInt16LE(i);energy+=v*v;}if(energy/Math.max(1,pcm.length/2)>350*350)lastVoicedAt=Date.now();}\n\
        \   }catch{}});\n   ws.on('framereceived',frame=>{\n    try {const event=JSON.parse(frame.payload.toString());\n\
        \     if(event.type==='audio_chunk'){const pcm=Buffer.from(event.audio_base64,'base64');events.push({type:event.type,turn:event.turn_id,bytes:pcm.length,nonSilent:pcm.some(v=>v!==0),at:Date.now()});}\n\
        \     else events.push({...event,at:Date.now(),...(event.type==='transcript_commit'&&lastVoicedAt?{synthetic_post_speech_commit_ms:Date.now()-lastVoicedAt}:{})});\n\
        \    }catch{}\n   });ws.on('socketerror',e=>errors.push('WebSocket error'));\n\
        \  });\n  await page.goto(origin,{waitUntil:'domcontentloaded'});\n  const\
        \ box=page.getByRole('textbox',{name:'Message DEUS'});await box.waitFor({timeout:45000});await\
        \ box.click();\n  const deadline=Date.now()+60000;\n  while(!events.some(e=>e.type==='telemetry')&&Date.now()<deadline)await\
        \ page.waitForTimeout(250);\n  const telemetry=events.find(e=>e.type==='telemetry');\n\
        \  const transcript=events.find(e=>e.type==='transcript_commit');\n  const\
        \ answer=events.filter(e=>e.type==='text_delta').map(e=>e.text).join('');\n\
        \  const audio=events.filter(e=>e.type==='audio_chunk');\n  const playback=await\
        \ page.evaluate(()=>window.__voicePlayback);\n  const persisted=await context.request.get(origin+'/api/v1/conversations/'+conversation.id+'/messages',{headers:auth});\n\
        \  const messages=await persisted.json();\n  const globals=await page.locator('.error-banner,.console-error').allTextContents();\n\
        \  console.log(JSON.stringify({mode:mobile?'phone':'desktop',transcript:transcript?.text,synthetic_post_speech_commit_ms:transcript?.synthetic_post_speech_commit_ms,answer,telemetry,audioChunks:audio.length,audioBytes:audio.reduce((n,e)=>n+e.bytes,0),playback,voiceMessages:messages.filter(m=>m.metadata_json?.voice).length,failures,errors,globals}));\n\
        \  if(!telemetry||!transcript||!answer.match(/quatro|\\b4\\b/i)||!audio.some(e=>e.nonSilent)||!playback.nonSilent||!playback.running||telemetry.provider_selected!=='freellmapi'||!messages.some(m=>m.role==='deus'&&m.metadata_json?.voice)||failures.length||errors.length||globals.length)throw\
        \ new Error('Actual public synthetic speech test failed');\n  // A typed turn\
        \ must still answer coherently after the completed voice turn.\n  await box.fill('Responda\
        \ apenas com o resultado: quanto \xE9 seis vezes sete?');\n  const reply=page.waitForResponse(r=>new\
        \ URL(r.url()).pathname.endsWith('/deus')&&r.request().method()==='POST');\n\
        \  await box.press('Enter');const typed=await reply;if(!typed.ok())throw new\
        \ Error('Typed turn failed: '+typed.status());\n  const body=await typed.json();console.log(JSON.stringify({mode:mobile?'phone':'desktop',typedStatus:typed.status(),typedAnswer:body.response}));if(!/^(42|quarenta\
        \ e dois)[.!]?$/i.test((body.response??'').trim()))throw new Error('Typed\
        \ answer was incoherent');\n  await context.close();\n }\n} finally {await\
        \ browser.close();unlinkSync(fixture);}\nJSDIAGNOSTIC\nnode frontend/local-voice-diagnostic.mjs"
    - name: Remove private files
      if: always()
      run: rm -f ~/.ssh/id_deploy "$RUNNER_TEMP/creation-session.json" "$RUNNER_TEMP/creation-voice-input.wav"
'on':
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the server
        type: choice
        required: true
        default: check
        options:
        - check
        - restart
        - update
        - set-inference
        - set-inference-freellmapi
        - set-creator-password
        - tidy
        - logs
        - set-voice
        - set-local-voice
        - smoke-test
        - stf-host-check
        - seed
      ref:
        description: Branch or tag to take the code from. Empty means the default
          branch.
        type: string
        required: false
        default: ''
