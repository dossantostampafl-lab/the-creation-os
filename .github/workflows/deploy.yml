name: Deploy
permissions:
  contents: read
concurrency:
  group: deploy-oracle
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Get the repository
      uses: actions/checkout@v5
    - name: Check the inputs and the configured secrets
      shell: bash
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        REF: ${{ inputs.ref }}
        FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      run: "set -euo pipefail\nmissing=\"\"\n[ -n \"${SSH_KEY:-}\" ] || missing=\"\
        $missing DEPLOY_SSH_KEY\"\n[ -n \"${HOST:-}\" ] || missing=\"$missing DEPLOY_HOST\"\
        \nif [ -n \"$missing\" ]; then\n  echo \"::error::Missing repository secret(s):$missing.\
        \ Add them under\" \\\n       \"Settings -> Secrets and variables -> Actions\
        \ -> New repository secret.\"\n  exit 1\nfi\n# The ref is typed by whoever\
        \ runs this and ends up inside a command the server runs,\n# so it is held\
        \ to the characters a git ref may contain and nothing else.\n# A bash match,\
        \ not a grep. grep would get this wrong twice: an empty ref emits no\n# line\
        \ at all, so nothing matches and the workflow's own default is rejected; and\n\
        # grep matches line by line, so a ref carrying a newline passes on its first\
        \ line\n# while the rest travels on to the server's shell.\nif ! [[ \"${REF:-}\"\
        \ =~ ^[A-Za-z0-9._/-]*$ ]]; then\n  echo \"::error::The ref may only contain\
        \ letters, digits, dot, underscore, slash and dash.\"\n  exit 1\nfi\n# These\
        \ two reach the server inside a quoted command line, so they are held to the\n\
        # characters a model name and an address may contain, and nothing else.\n\
        if ! [[ \"${FREELLMAPI_MODEL:-}\" =~ ^[A-Za-z0-9._:/-]*$ ]]; then\n  echo\
        \ \"::error::FREELLMAPI_MODEL may only contain letters, digits, dot, underscore,\
        \ colon, slash and dash.\"\n  exit 1\nfi\nif ! [[ \"${FREELLMAPI_BASE_URL:-}\"\
        \ =~ ^(https?://[A-Za-z0-9._:/-]+)?$ ]]; then\n  echo \"::error::FREELLMAPI_BASE_URL\
        \ must be an http(s) address without spaces, quotes or credentials.\"\n  exit\
        \ 1\nfi\n"
    - name: Open an SSH session to the server
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      run: "set -euo pipefail\nmkdir -m 700 -p ~/.ssh\n# printf, not echo: the key\
        \ is written verbatim or not at all.\nprintf '%s\\n' \"$SSH_KEY\" > ~/.ssh/id_deploy\n\
        chmod 600 ~/.ssh/id_deploy\nif [ -n \"${HOST_KEY:-}\" ]; then\n  # A secret\
        \ overrides, for a server whose keys the repository does not carry.\n  printf\
        \ '%s\\n' \"$HOST_KEY\" > ~/.ssh/known_hosts\n  echo \"The host key is pinned\
        \ by the DEPLOY_SSH_HOST_KEY secret.\"\nelif [ -s deploy/oracle/known_hosts\
        \ ]; then\n  # The normal case. A host key is public, so it lives in the repository,\
        \ where it\n  # can be read back and reviewed -- unlike a secret, which nobody\
        \ can check again.\n  cp deploy/oracle/known_hosts ~/.ssh/known_hosts\n  echo\
        \ \"The host key is pinned by deploy/oracle/known_hosts.\"\nelse\n  # Nothing\
        \ to pin against. Trust on first use, and say so.\n  ssh-keyscan -T 10 \"\
        $HOST\" > ~/.ssh/known_hosts 2>/dev/null\n  echo \"::warning::No pinned host\
        \ key, so this run trusted whatever answered.\"\n  echo \"Record the lines\
        \ below in deploy/oracle/known_hosts:\"\n  cat ~/.ssh/known_hosts\nfi\nchmod\
        \ 600 ~/.ssh/known_hosts\n"
    - name: Read voice quota and verify current synthesis without logging credentials
      env:
        HOST: ${{ secrets.DEPLOY_HOST }}
        USERNAME: ${{ secrets.DEPLOY_USER }}
      run: "set -euo pipefail\nssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20\
        \ \"${USERNAME:-ubuntu}@$HOST\" 'bash -s' <<'REMOTEPROBE'\nset -euo pipefail\n\
        api=\"$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format\
        \ '{{.ID}}' | head -1)\"\nsudo docker exec -i \"$api\" python - <<'PROVIDERPY'\n\
        import asyncio,json,time,re\nimport httpx\nfrom app.config import settings\n\
        from app.voice_session.tts import ElevenLabsTTSConfig,ElevenLabsRealtimeTTS\n\
        async def main():\n key=settings.elevenlabs_api_key.get_secret_value()\n print(json.dumps({'voice_key_configured':bool(key),'voice_id_configured':bool(settings.elevenlabs_voice_id),'model':settings.elevenlabs_model_id}),flush=True)\n\
        \ async with httpx.AsyncClient(timeout=20,headers={'xi-api-key':key}) as client:\n\
        \  for path in ['/v1/user/subscription','/v1/user']:\n   response=await client.get('https://api.elevenlabs.io'+path)\n\
        \   output={'probe':path,'status':response.status_code}\n   if response.status_code==200:\n\
        \    data=response.json();sub=data if path.endswith('subscription') else data.get('subscription',{})\n\
        \    for name in ['tier','status','character_count','character_limit','next_character_count_reset_unix','can_extend_character_limit','has_open_invoices']:\n\
        \     if name in sub and isinstance(sub[name],(str,int,float,bool,type(None))):output[name]=sub[name]\n\
        \    if isinstance(sub.get('character_count'),int) and isinstance(sub.get('character_limit'),int):output['remaining']=sub['character_limit']-sub['character_count']\n\
        \   else:\n    detail=response.json().get('detail',{})\n    if isinstance(detail,dict):output['vendor_status']=detail.get('status')\n\
        \   print(json.dumps(output),flush=True)\n config=ElevenLabsTTSConfig(api_key=key,voice_id=settings.elevenlabs_voice_id,model_id=settings.elevenlabs_model_id)\n\
        \ started=time.monotonic();audio_count=0\n try:\n  async with asyncio.timeout(20):\n\
        \   async with ElevenLabsRealtimeTTS(config) as tts:\n    conn=tts._require_connection();original_recv=conn.recv\n\
        \    async def traced_recv(*args,**kwargs):\n     raw=await original_recv(*args,**kwargs);data=json.loads(raw)\n\
        \     out={'probe':'tts-current','vendor_error':data.get('error') if isinstance(data.get('error'),str)\
        \ else None}\n     message=data.get('message','')\n     if isinstance(message,str):\n\
        \      for label,pattern in [('remaining_credits',r'(\\d+) credits? remaining'),('required_credits',r'(\\\
        d+) credits? (?:are )?required')]:\n       match=re.search(pattern,message,re.I)\n\
        \       if match:out[label]=int(match.group(1))\n     if data.get('error'):print(json.dumps(out),flush=True)\n\
        \     return raw\n    conn.recv=traced_recv\n    await tts.send_text('Estou\
        \ aqui.');await tts.finish()\n    while True:\n     audio=await tts.receive_audio()\n\
        \     if audio is None:break\n     audio_count+=1\n  print(json.dumps({'probe':'tts-current','audio_count':audio_count,'elapsed_ms':round((time.monotonic()-started)*1000)}),flush=True)\n\
        \ except Exception as error:print(json.dumps({'probe':'tts-current','error_type':type(error).__name__,'code':getattr(error,'code',None),'audio_count':audio_count,'elapsed_ms':round((time.monotonic()-started)*1000)}),flush=True)\n\
        asyncio.run(main())\nPROVIDERPY\nREMOTEPROBE\n"
    - name: Remove the key
      if: always()
      run: rm -f ~/.ssh/id_deploy
'on':
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the server
        type: choice
        required: true
        default: check
        options:
        - check
        - restart
        - update
        - set-inference
        - set-inference-freellmapi
        - set-creator-password
        - tidy
        - logs
        - set-voice
        - smoke-test
        - stf-host-check
        - seed
      ref:
        description: Branch or tag to take the code from. Empty means the default
          branch.
        type: string
        required: false
        default: ''
