name: Deploy
permissions:
  contents: read
concurrency:
  group: deploy-oracle
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Get the repository
      uses: actions/checkout@v5
    - name: Check the inputs and the configured secrets
      shell: bash
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        REF: ${{ inputs.ref }}
        FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      run: "set -euo pipefail\nmissing=\"\"\n[ -n \"${SSH_KEY:-}\" ] || missing=\"\
        $missing DEPLOY_SSH_KEY\"\n[ -n \"${HOST:-}\" ] || missing=\"$missing DEPLOY_HOST\"\
        \nif [ -n \"$missing\" ]; then\n  echo \"::error::Missing repository secret(s):$missing.\
        \ Add them under\" \\\n       \"Settings -> Secrets and variables -> Actions\
        \ -> New repository secret.\"\n  exit 1\nfi\n# The ref is typed by whoever\
        \ runs this and ends up inside a command the server runs,\n# so it is held\
        \ to the characters a git ref may contain and nothing else.\n# A bash match,\
        \ not a grep. grep would get this wrong twice: an empty ref emits no\n# line\
        \ at all, so nothing matches and the workflow's own default is rejected; and\n\
        # grep matches line by line, so a ref carrying a newline passes on its first\
        \ line\n# while the rest travels on to the server's shell.\nif ! [[ \"${REF:-}\"\
        \ =~ ^[A-Za-z0-9._/-]*$ ]]; then\n  echo \"::error::The ref may only contain\
        \ letters, digits, dot, underscore, slash and dash.\"\n  exit 1\nfi\n# These\
        \ two reach the server inside a quoted command line, so they are held to the\n\
        # characters a model name and an address may contain, and nothing else.\n\
        if ! [[ \"${FREELLMAPI_MODEL:-}\" =~ ^[A-Za-z0-9._:/-]*$ ]]; then\n  echo\
        \ \"::error::FREELLMAPI_MODEL may only contain letters, digits, dot, underscore,\
        \ colon, slash and dash.\"\n  exit 1\nfi\nif ! [[ \"${FREELLMAPI_BASE_URL:-}\"\
        \ =~ ^(https?://[A-Za-z0-9._:/-]+)?$ ]]; then\n  echo \"::error::FREELLMAPI_BASE_URL\
        \ must be an http(s) address without spaces, quotes or credentials.\"\n  exit\
        \ 1\nfi\n"
    - name: Open an SSH session to the server
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      run: "set -euo pipefail\nmkdir -m 700 -p ~/.ssh\n# printf, not echo: the key\
        \ is written verbatim or not at all.\nprintf '%s\\n' \"$SSH_KEY\" > ~/.ssh/id_deploy\n\
        chmod 600 ~/.ssh/id_deploy\nif [ -n \"${HOST_KEY:-}\" ]; then\n  # A secret\
        \ overrides, for a server whose keys the repository does not carry.\n  printf\
        \ '%s\\n' \"$HOST_KEY\" > ~/.ssh/known_hosts\n  echo \"The host key is pinned\
        \ by the DEPLOY_SSH_HOST_KEY secret.\"\nelif [ -s deploy/oracle/known_hosts\
        \ ]; then\n  # The normal case. A host key is public, so it lives in the repository,\
        \ where it\n  # can be read back and reviewed -- unlike a secret, which nobody\
        \ can check again.\n  cp deploy/oracle/known_hosts ~/.ssh/known_hosts\n  echo\
        \ \"The host key is pinned by deploy/oracle/known_hosts.\"\nelse\n  # Nothing\
        \ to pin against. Trust on first use, and say so.\n  ssh-keyscan -T 10 \"\
        $HOST\" > ~/.ssh/known_hosts 2>/dev/null\n  echo \"::warning::No pinned host\
        \ key, so this run trusted whatever answered.\"\n  echo \"Record the lines\
        \ below in deploy/oracle/known_hosts:\"\n  cat ~/.ssh/known_hosts\nfi\nchmod\
        \ 600 ~/.ssh/known_hosts\n"
    - name: Benchmark disposable local speech on the actual ARM server
      env:
        HOST: ${{ secrets.DEPLOY_HOST }}
        USERNAME: ${{ secrets.DEPLOY_USER }}
      run: "set -euo pipefail\nssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20\
        \ \"${USERNAME:-ubuntu}@$HOST\" 'bash -s' <<'REMOTE'\nset -euo pipefail\n\
        api=\"$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format\
        \ '{{.ID}}' | head -1)\"\nimage=\"$(sudo docker inspect --format '{{.Image}}'\
        \ \"$api\")\"\n# Disposable evaluation: no production volumes, credentials,\
        \ env files or service ports.\nsudo docker run --rm -i --name creation-free-voice-evaluation\
        \ --cpus=1.5 --memory=3g --entrypoint /bin/sh -e HF_HUB_DISABLE_XET=1 \"$image\"\
        \ -s <<'CONTAINER'\nset -eu\npython -m venv /tmp/probe-venv\n/tmp/probe-venv/bin/pip\
        \ install --quiet 'piper-tts==1.8.0' 'faster-whisper==1.2.1' 'av==16.1.0'\n\
        mkdir -p /tmp/models\ncd /tmp/models\n/tmp/probe-venv/bin/python -m piper.download_voices\
        \ pt_BR-faber-medium\n/tmp/probe-venv/bin/python - <<'BENCHMARKPY'\nimport\
        \ json,time,wave,resource\nfrom piper import PiperVoice\nfrom faster_whisper\
        \ import WhisperModel\nimport ctranslate2\nprint(json.dumps({'supported_cpu_types':sorted(ctranslate2.get_supported_compute_types('cpu'))}),flush=True)\n\
        started=time.monotonic();voice=PiperVoice.load('/tmp/models/pt_BR-faber-medium.onnx')\n\
        print(json.dumps({'tts_load_ms':round((time.monotonic()-started)*1000)}),flush=True)\n\
        phrases=['Deus, quanto \xE9 dois mais dois?','Quanto \xE9 dez mais cinco,\
        \ Deus?','Deus, explique o que \xE9 uma estrela.']\nfor i,text in enumerate(phrases):\n\
        \ started=time.monotonic();first=None;chunks=[]\n for chunk in voice.synthesize(text):\n\
        \  if first is None:first=round((time.monotonic()-started)*1000)\n  chunks.append(chunk.audio_int16_bytes);rate=chunk.sample_rate\n\
        \ with wave.open('/tmp/sample'+str(i)+'.wav','wb') as out:\n  out.setnchannels(1);out.setsampwidth(2);out.setframerate(rate);out.writeframes(b''.join(chunks))\n\
        \ print(json.dumps({'tts_text':text,'first_audio_ms':first,'total_ms':round((time.monotonic()-started)*1000),'audio_seconds':round(sum(map(len,chunks))/2/rate,2)}),flush=True)\n\
        for name in ['small']:\n started=time.monotonic();model=WhisperModel(name,device='cpu',compute_type='int8',cpu_threads=2,num_workers=1,download_root='/tmp/models')\n\
        \ print(json.dumps({'stt_model':name,'download_and_load_ms':round((time.monotonic()-started)*1000)}),flush=True)\n\
        \ for i,text in enumerate(phrases):\n  started=time.monotonic()\n  segments,info=model.transcribe('/tmp/sample'+str(i)+'.wav',language='pt',beam_size=1,condition_on_previous_text=False,vad_filter=False)\n\
        \  result=' '.join(s.text.strip() for s in segments)\n  print(json.dumps({'stt_model':name,'expected':text,'transcript':result,'elapsed_ms':round((time.monotonic()-started)*1000),'peak_memory_MiB':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024)}),flush=True)\n\
        \ del model\nBENCHMARKPY\nCONTAINER\nREMOTE\n"
    - name: Remove private SSH file
      if: always()
      run: rm -f ~/.ssh/id_deploy
'on':
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the server
        type: choice
        required: true
        default: check
        options:
        - check
        - restart
        - update
        - set-inference
        - set-inference-freellmapi
        - set-creator-password
        - tidy
        - logs
        - set-voice
        - smoke-test
        - stf-host-check
        - seed
      ref:
        description: Branch or tag to take the code from. Empty means the default
          branch.
        type: string
        required: false
        default: ''
