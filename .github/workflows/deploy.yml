# Operating the Oracle server from a browser, so that keeping it running does not require a
# terminal. It only ever runs when a person presses Run workflow: a push must not be able to
# reach the server, and nothing here is triggered by one.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do on the server"
        type: choice
        required: true
        default: check
        options:
          - check
          - check-chat-instructions
          - check-chatgpt-auth
          - import-chatgpt-credentials
          - check-universe-inference
          - repair-universe-inference
          - restart
          - update
          - set-inference
          - set-inference-chatgpt
          - set-inference-freellmapi
          - set-creator-password
          - tidy
          - logs
          - set-local-voice
          - smoke-test
          - stf-host-check
          - enable-connected-deus
          - enable-observability
          - enable-public-discovery
          - enable-cyber-range-training
          - seed
          - publish-builds
          - browser-gauntlet
      ref:
        description: "Branch or tag to take the code from. Empty means the default branch."
        type: string
        required: false
        default: ""
      voice_models:
        description: "Optional DEUS voice FreeLLM model pool, comma-separated."
        type: string
        required: false
        default: ""

# Reading the repository is all this needs; it must not be able to write to it.
permissions:
  contents: read

# Two runs at once would fight over the same .env and the same containers.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.task == 'publish-builds' && 45 || 20 }}
    steps:
      - name: Get the repository
        uses: actions/checkout@v5

      - name: Check the inputs and the configured secrets
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          REF: ${{ inputs.ref }}
          DEUS_VOICE_CONVERSATION_MODELS: ${{ inputs.voice_models }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SSH_KEY:-}" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "${HOST:-}" ] || missing="$missing DEPLOY_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under" \
                 "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          # The ref is typed by whoever runs this and ends up inside a command the server runs,
          # so it is held to the characters a git ref may contain and nothing else.
          # A bash match, not a grep. grep would get this wrong twice: an empty ref emits no
          # line at all, so nothing matches and the workflow's own default is rejected; and
          # grep matches line by line, so a ref carrying a newline passes on its first line
          # while the rest travels on to the server's shell.
          if ! [[ "${REF:-}" =~ ^[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::The ref may only contain letters, digits, dot, underscore, slash and dash."
            exit 1
          fi
          # These two reach the server inside a quoted command line, so they are held to the
          # characters a model name and an address may contain, and nothing else.
          if ! [[ "${FREELLMAPI_MODEL:-}" =~ ^[A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::FREELLMAPI_MODEL may only contain letters, digits, dot, underscore, colon, slash and dash."
            exit 1
          fi
          if ! [[ "${FREELLMAPI_BASE_URL:-}" =~ ^(https?://[A-Za-z0-9._:/-]+)?$ ]]; then
            echo "::error::FREELLMAPI_BASE_URL must be an http(s) address without spaces, quotes or credentials."
            exit 1
          fi
          if ! [[ "${DEUS_VOICE_CONVERSATION_MODELS:-}" =~ ^([A-Za-z0-9._:/-]+(,[A-Za-z0-9._:/-]+)*)?$ ]]; then
            echo "::error::voice_models must be an optional comma-separated list of model names."
            exit 1
          fi

      - name: Get the selected ref for Android builds
        if: inputs.task == 'publish-builds' || inputs.task == 'browser-gauntlet'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Set up Node for Android builds
        if: inputs.task == 'publish-builds' || inputs.task == 'browser-gauntlet'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare the real browser gauntlet
        if: inputs.task == 'browser-gauntlet'
        shell: bash
        run: |
          npm ci --prefix frontend --ignore-scripts
          cd frontend
          npx playwright install --with-deps chromium

      - name: Set up Java for Android builds
        if: inputs.task == 'publish-builds'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the runner's preinstalled Android SDK
        if: inputs.task == 'publish-builds'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$sdk_root" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "::error::The Ubuntu runner must provide ANDROID_HOME and cmdline-tools/latest/bin/sdkmanager."
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Build the three Android files and their verified manifest
        if: inputs.task == 'publish-builds'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm ci --prefix frontend
          chmod +x frontend/android/gradlew
          npm run mobile:android --prefix frontend
          mkdir -p build-staging
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-staging/creation-debug.apk
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk build-staging/creation-release-unsigned.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab build-staging/creation-release.aab
          node frontend/scripts/create-build-manifest.mjs build-staging "$(git rev-parse HEAD)"

      - name: Open an SSH session to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p ~/.ssh
          # printf, not echo: the key is written verbatim or not at all.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${HOST_KEY:-}" ]; then
            # A secret overrides, for a server whose keys the repository does not carry.
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
            echo "The host key is pinned by the DEPLOY_SSH_HOST_KEY secret."
          elif [ -s deploy/oracle/known_hosts ]; then
            # The normal case. A host key is public, so it lives in the repository, where it
            # can be read back and reviewed -- unlike a secret, which nobody can check again.
            cp deploy/oracle/known_hosts ~/.ssh/known_hosts
            echo "The host key is pinned by deploy/oracle/known_hosts."
          else
            # Nothing to pin against. Trust on first use, and say so.
            ssh-keyscan -T 10 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::No pinned host key, so this run trusted whatever answered."
            echo "Record the lines below in deploy/oracle/known_hosts:"
            cat ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Publish verified Android files on the server
        if: inputs.task == 'publish-builds'
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          REPO_DIR: ${{ secrets.DEPLOY_REPO_DIR }}
        run: |
          set -euo pipefail
          # This directory travels in a quoted remote command, so reject shell syntax.
          if ! [[ "${REPO_DIR:-}" =~ ^(/[A-Za-z0-9._/-]+)?$ ]]; then
            echo "::error::DEPLOY_REPO_DIR must be an absolute path without spaces or shell syntax."
            exit 1
          fi
          server="${USERNAME:-ubuntu}@$HOST"
          SSH=(ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20)
          staging="$("${SSH[@]}" "$server" 'mktemp -d /tmp/creation-builds.XXXXXXXXXX')"
          if ! [[ "$staging" =~ ^/tmp/creation-builds\.[A-Za-z0-9]+$ ]]; then
            echo "::error::The host did not return a valid staging directory."
            exit 1
          fi
          cleanup() { "${SSH[@]}" "$server" "sudo rm -rf -- '$staging'" || true; }
          trap cleanup EXIT
          scp -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            build-staging/manifest.json build-staging/creation-debug.apk \
            build-staging/creation-release-unsigned.apk build-staging/creation-release.aab \
            deploy/oracle/publish-builds.sh "$server:$staging/"
          "${SSH[@]}" "$server" "bash -s -- '$staging' '${REPO_DIR:-}'" <<'REMOTE'
          set -euo pipefail
          staging="$1"
          REPO_DIR="$2"
          live_dir=""
          api_container="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
          if [ -n "$api_container" ]; then
            live_dir="$(sudo docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$api_container" 2>/dev/null || true)"
          fi
          REPO_DIR="${REPO_DIR:-${live_dir:-$HOME/the-creation-os}}"
          cd "$REPO_DIR"
          sudo git rev-parse --git-dir >/dev/null
          REPO_DIR="$(pwd -P)"
          # Publish local immutable files only; this never rebuilds/restarts runtime profiles.
          sudo bash "$staging/publish-builds.sh" "$staging" "$REPO_DIR/releases"
          REMOTE

      - name: Run the task on the server
        if: inputs.task != 'publish-builds' && inputs.task != 'browser-gauntlet'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          REPO_DIR: ${{ secrets.DEPLOY_REPO_DIR }}
          TASK: ${{ inputs.task }}
          REF: ${{ inputs.ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          CREATOR_PASSWORD: ${{ secrets.CREATOR_PASSWORD }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          CHATGPT_CREDENTIALS_JSON: ${{ secrets.CHATGPT_CREDENTIALS_JSON }}
          DEUS_VOICE_CONVERSATION_MODELS: ${{ inputs.voice_models }}
        run: |
          set -euo pipefail

          if [ "$TASK" = "import-chatgpt-credentials" ] && [ -z "${CHATGPT_CREDENTIALS_JSON:-}" ]; then
            echo "::error::import-chatgpt-credentials needs the CHATGPT_CREDENTIALS_JSON secret: the full" \
                 "contents of the credentials.json written by chatgpt_connect. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then run this task again."
            exit 1
          fi
          # The credential file spans several lines, so it travels as one base64 line down the
          # same pipe as the other secrets: never as an argument, never in the log.
          chatgpt_credentials_b64=""
          if [ "$TASK" = "import-chatgpt-credentials" ]; then
            chatgpt_credentials_b64="$(printf '%s' "$CHATGPT_CREDENTIALS_JSON" | base64 -w0)"
          fi

          # set-inference without the ANTHROPIC_API_KEY secret keeps the key the server's .env
          # already holds, so changing only the model or the Workspace ID does not require
          # pasting the key again. The script on the server refuses when there is none.
          if [ "$TASK" = "set-creator-password" ] && [ -z "${CREATOR_PASSWORD:-}" ]; then
            echo "::error::set-creator-password needs the CREATOR_PASSWORD secret. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then run this task again."
            exit 1
          fi
          # The key goes down the pipe as the first line, never as an argument: an argument is
          # visible in the server's process list to anyone who can run ps while this runs.
          # It is never put through a sed or a regex either -- a key holding the expression's
          # delimiter would break that silently.
          {
            printf '%s\n' "${ANTHROPIC_API_KEY:-}"
            printf '%s\n' "${CREATOR_PASSWORD:-}"
            printf '%s\n' "${FREELLMAPI_API_KEY:-}"
            printf '%s\n' "$chatgpt_credentials_b64"
            cat <<'REMOTE'
          set -euo pipefail
          # A server can carry more than one checkout: install.sh works where it is, and
          # bootstrap-oracle.sh installs into /opt. The running api container names the
          # directory its Compose project was started from, and that is the only one whose
          # .env the API is reading. DEPLOY_REPO_DIR overrides it when it is set.
          live_dir=""
          api_container="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
          if [ -n "$api_container" ]; then
            live_dir="$(sudo docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$api_container" 2>/dev/null || true)"
          fi
          cd "${REPO_DIR:-${live_dir:-$HOME/the-creation-os}}"
          echo "== Server: $(hostname), acting on: $(pwd) =="
          if [ -n "$live_dir" ] && [ "$live_dir" != "$(pwd)" ]; then
            echo "== Note: the running api container was started from $live_dir =="
          fi

          # Every git call runs as root, because an installation cloned by bootstrap-oracle.sh
          # belongs to root: git run as anyone else refuses it as dubious ownership and exits
          # 128, which under pipefail takes the whole run down with no explanation.
          if ! sudo git rev-parse --git-dir >/dev/null 2>&1; then
            echo "$(pwd) is not a git repository, so the deploy scripts cannot be updated." >&2
            exit 1
          fi

          # The deploy scripts are taken from the repository on every run, so a fix to them
          # takes effect without anyone opening a terminal.
          target="${REF:-}"
          if [ -z "$target" ]; then
            target="$(sudo git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)"
          fi
          target="${target:-main}"
          sudo git fetch --prune origin
          # Installations cloned with --single-branch do not fetch feature refs by default.
          sudo git fetch origin "+$target:refs/remotes/origin/$target"
          sudo git checkout "origin/$target" -- deploy/oracle deploy/stf
          sudo chmod +x deploy/oracle/*.sh deploy/stf/*.sh
          echo "== Deploy scripts taken from origin/$target =="
          # Sites another project appended to deploy/Caddyfile (Star Trek 1) survive every deploy.
          sudo ./deploy/oracle/keep-caddy-sites.sh "origin/$target" \
            || echo "WARNING: deploy/Caddyfile was left as it was." >&2

          COMPOSE=(docker compose -f docker-compose.yml -f docker-compose.cloud.yml)
          case "$TASK" in
            check)
              sudo ./deploy/oracle/check-inference.sh
              ;;
            check-chat-instructions)
              sudo "${COMPOSE[@]}" exec -T api python - < deploy/oracle/check-chat-instructions.py
              ;;
            check-chatgpt-auth)
              api="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
              if [ -z "$api" ]; then
                echo "The API container is not running." >&2
                exit 1
              fi
              sudo docker exec -i "$api" python - --full < deploy/oracle/check-chatgpt-auth.py
              ;;
            import-chatgpt-credentials)
              # The importer needs the ChatGPT-capable stack and the VM host ID in place. The file
              # exists only for the duration of the import, owner-only, and is removed afterwards.
              credential_file="$(umask 077; mktemp)"
              trap 'rm -f "$credential_file"' EXIT
              if ! printf '%s' "${CHATGPT_CREDENTIALS_B64:-}" | base64 -d > "$credential_file" 2>/dev/null; then
                echo "CHATGPT_CREDENTIALS_JSON could not be decoded. Paste the whole credentials.json into the secret." >&2
                exit 1
              fi
              unset CHATGPT_CREDENTIALS_B64
              sudo ./deploy/oracle/chatgpt-host-id.sh
              sudo ./deploy/oracle/import-chatgpt-credentials.sh "$credential_file"
              rm -f "$credential_file"
              api="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
              sudo docker exec -i "$api" python - --full < deploy/oracle/check-chatgpt-auth.py
              ;;
            check-universe-inference)
              sudo env UNIVERSE_INFERENCE_DIAGNOSTIC=true ./deploy/oracle/check-inference.sh
              ;;
            repair-universe-inference)
              sudo "${COMPOSE[@]}" exec -T api python -m app.admin.seed --repair-inference-only
              ;;
            restart)
              sudo "${COMPOSE[@]}" up -d --force-recreate api worker
              sleep 20
              sudo ./deploy/oracle/check-inference.sh
              ;;
            update)
              sudo git merge --ff-only "origin/$target"
              # Do not silently drop the declared reserve after a voice/deploy cycle.
              # Repair the two supported production chains when an older .env predates
              # the fallback fields: ChatGPT -> FreeLLMAPI, or FreeLLMAPI -> Anthropic.
              sudo bash -c '
                source ./deploy/oracle/env-file.sh
                provider="$(env_get LLM_PROVIDER)"
                fallback="$(env_get LLM_FALLBACK_PROVIDERS)"
                if [ "$provider" = "chatgpt" ] \
                   && [ -z "$fallback" ] \
                   && [ -n "$(env_get FREELLMAPI_MODEL)" ] \
                   && [ -n "$(env_get FREELLMAPI_BASE_URL)" ]; then
                  env_set LLM_FALLBACK_PROVIDERS freellmapi
                  env_set CHATGPT_FALLBACK_ENABLED true
                elif [ "$provider" = "chatgpt" ] && [ -n "$fallback" ]; then
                  # set-inference.sh writes this invariant. Older deployments may have
                  # the reserve list without the disclosure gate that lets the router use it.
                  env_set CHATGPT_FALLBACK_ENABLED true
                  # A configured Anthropic answers when both the plan and FreeLLMAPI cannot.
                  if [ "$fallback" = "freellmapi" ] \
                     && [ -n "$(env_get ANTHROPIC_API_KEY)" ] \
                     && [ -n "$(env_get ANTHROPIC_MODEL)" ]; then
                    env_set LLM_FALLBACK_PROVIDERS freellmapi,anthropic
                  fi
                elif [ "$provider" = "freellmapi" ] \
                   && [ -z "$fallback" ] \
                   && [ -n "$(env_get ANTHROPIC_API_KEY)" ] \
                   && [ -n "$(env_get ANTHROPIC_MODEL)" ]; then
                  env_set LLM_FALLBACK_PROVIDERS anthropic
                fi
                # The old 5s/15s reserve deadlines were shorter than a FreeLLMAPI answer takes, so
                # the reserve always timed out. Raise them unless the operator chose other values.
                per_provider="$(env_get DEUS_CHAT_PROVIDER_TIMEOUT_SECONDS)"
                if [ -z "$per_provider" ] || [ "$per_provider" = "5" ] || [ "$per_provider" = "5.0" ]; then
                  env_set DEUS_CHAT_PROVIDER_TIMEOUT_SECONDS 12
                fi
                total="$(env_get DEUS_CHAT_TOTAL_TIMEOUT_SECONDS)"
                if [ -z "$total" ] || [ "$total" = "15" ] || [ "$total" = "15.0" ]; then
                  env_set DEUS_CHAT_TOTAL_TIMEOUT_SECONDS 25
                fi
                # A stuck ChatGPT turn hands over to the reserve after 10s, not 25s.
                plan="$(env_get DEUS_CHAT_CHATGPT_TIMEOUT_SECONDS)"
                if [ -z "$plan" ] || [ "$plan" = "25" ] || [ "$plan" = "25.0" ]; then
                  env_set DEUS_CHAT_CHATGPT_TIMEOUT_SECONDS 10
                fi
                # One opportunity competition every 3 hours instead of every minute.
                cycle="$(env_get OPPORTUNITY_COMPETITION_CYCLE_SECONDS)"
                if [ -z "$cycle" ] || [ "$cycle" = "60" ]; then
                  env_set OPPORTUNITY_COMPETITION_CYCLE_SECONDS 10800
                fi
              '
              # Preserve every optional runtime profile already enabled on this host.
              profile_args=()
              if sudo grep -qE '^DEUS_(CONTEXT_RETRIEVAL|DIAGNOSTICS|AUTONOMY_DISCOVERY|AUTONOMY_COMPETITION)_ENABLED=true$' .env; then
                profile_args+=(--profile connected-deus)
              fi
              if sudo grep -q '^STF_AUTO_TRAINING_ENABLED=true$' .env; then
                profile_args+=(--profile security-task-force)
              fi
              if sudo grep -q '^TELEMETRY_ENABLED=true$' .env; then
                profile_args+=(--profile observability)
              fi
              # New local speech models (e.g. the "Deus" wake spotter) must exist before the API starts.
              if sudo grep -q '^DEUS_VOICE_SESSION_ENABLED=true$' .env; then
                sudo "${COMPOSE[@]}" build api
                sudo "${COMPOSE[@]}" run --rm --no-deps api python -m app.voice_session.prepare
              fi
              sudo "${COMPOSE[@]}" "${profile_args[@]}" up -d --build --remove-orphans
              sleep 30
              sudo ./deploy/oracle/check-inference.sh
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            enable-observability)
              sudo git merge --ff-only "origin/$target"
              sudo ./deploy/oracle/enable-observability.sh
              ;;
            enable-public-discovery)
              sudo git merge --ff-only "origin/$target"
              sudo ./deploy/oracle/enable-public-discovery.sh
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            enable-connected-deus)
              sudo git merge --ff-only "origin/$target"
              sudo ./deploy/oracle/enable-connected-deus.sh
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            enable-cyber-range-training)
              sudo git merge --ff-only "origin/$target"
              sudo ./deploy/oracle/enable-cyber-range-training.sh
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            set-inference)
              sudo -E ./deploy/oracle/set-inference.sh anthropic "${ANTHROPIC_MODEL:-claude-sonnet-5}"
              ;;
            set-inference-chatgpt)
              # This provider lives in application code, not only in .env. Pull the selected
              # revision and rebuild api/worker before switching the runtime to ChatGPT.
              sudo git merge --ff-only "origin/$target"
              sudo "${COMPOSE[@]}" build api worker
              # ChatGPT plan first. FreeLLMAPI answers only when the plan cannot, and every such reply
              # names the provider that answered and why: a disclosed, never silent, switch.
              # Anthropic joins the reserve only when it is configured: set-inference.sh refuses a
              # reserve without its key and model.
              reserves="$(sudo bash -c 'source ./deploy/oracle/env-file.sh
                if [ -n "$(env_get ANTHROPIC_API_KEY)" ] && [ -n "$(env_get ANTHROPIC_MODEL)" ]; then
                  echo freellmapi,anthropic
                else
                  echo freellmapi
                fi')"
              FALLBACK_PROVIDERS="$reserves" sudo -E ./deploy/oracle/set-inference.sh chatgpt gpt-6.1-sol
              sudo ./deploy/oracle/check-inference.sh
              ;;
            set-inference-freellmapi)
              # FreeLLMAPI first, Claude as the reserve. The script refuses, and changes nothing,
              # unless the reserve is already fully configured in .env.
              FALLBACK_PROVIDERS=anthropic sudo -E ./deploy/oracle/set-inference.sh freellmapi "${FREELLMAPI_MODEL:-auto}"
              ;;
            set-creator-password)
              sudo -E ./deploy/oracle/set-creator-password.sh
              ;;
            tidy)
              sudo ./deploy/oracle/tidy-server.sh
              ;;
            logs)
              sudo ./deploy/oracle/show-logs.sh 150
              ;;
            set-local-voice)
              sudo git merge --ff-only "origin/$target"
              DEUS_VOICE_CONVERSATION_MODELS="${DEUS_VOICE_CONVERSATION_MODELS:-}" sudo -E ./deploy/oracle/set-local-voice.sh
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            seed)
              # Idempotent: it reconciles the canonical Universes and their Agents rather than
              # inserting. A deploy brings new code, never new rows, so this is its own step.
              api="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
              sudo docker exec -i "$api" seed-universes
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            stf-host-check)
              # Read-only: reports whether this server could run privileged Task Force work
              # (KVM, Kata, Firecracker). It installs and changes nothing.
              sudo ./deploy/oracle/stf-host-check.sh
              ;;
            smoke-test)
              # --deus sends one short message, so the report covers the path that matters
              # most and the one nothing else exercises.
              sudo ./deploy/oracle/smoke-test.sh --deus
              ;;
            *)
              echo "Unknown task: $TASK" >&2
              exit 1
              ;;
          esac
          REMOTE
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
                "${USERNAME:-ubuntu}@$HOST" \
                "export REPO_DIR='${REPO_DIR:-}' TASK='$TASK' REF='$REF' \
                        ANTHROPIC_MODEL='${ANTHROPIC_MODEL:-}' \
                        ANTHROPIC_WORKSPACE_ID='${ANTHROPIC_WORKSPACE_ID:-}' \
                        FREELLMAPI_MODEL='${FREELLMAPI_MODEL:-}' \
                        FREELLMAPI_BASE_URL='${FREELLMAPI_BASE_URL:-}' \
                        DEUS_VOICE_CONVERSATION_MODELS='${DEUS_VOICE_CONVERSATION_MODELS:-}'; \
                 IFS= read -r ANTHROPIC_API_KEY; IFS= read -r CREATOR_PASSWORD; \
                 IFS= read -r FREELLMAPI_API_KEY; IFS= read -r CHATGPT_CREDENTIALS_B64; \
                 export ANTHROPIC_API_KEY CREATOR_PASSWORD FREELLMAPI_API_KEY CHATGPT_CREDENTIALS_B64; exec bash -s"

      - name: Run authenticated gauntlet in a real browser
        if: inputs.task == 'browser-gauntlet'
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Only an ephemeral access token and synthetic QA audio travel through stdin.
          # No Creator password, refresh token, browser profile or private chat is exported.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "${USERNAME:-ubuntu}@$HOST" 'bash -s' <<'REMOTE' | node frontend/scripts/live-gauntlet.mjs
          set -euo pipefail
          api="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.ID}}' | head -1)"
          minio_count="$(sudo docker ps -a --format '{{.Image}} {{.Names}}' | awk 'tolower($0) ~ /minio/ {count++} END {print count+0}')"
          sudo docker exec -i -e QA_MINIO_COUNT="$minio_count" "$api" python - <<'PY'
          import asyncio, base64, json, os, httpx
          from app.voice_session.local import get_local_engine
          async def main():
              with httpx.Client(timeout=15) as client:
                  response = client.post('http://127.0.0.1:8000/api/v1/auth/login', json={
                      'username': os.environ['CREATOR_BOOTSTRAP_USERNAME'],
                      'password': os.environ['CREATOR_BOOTSTRAP_PASSWORD'],
                  })
                  if response.status_code != 200:
                      raise RuntimeError('QA login failed: HTTP ' + str(response.status_code))
                  access = response.json()['access_token']
              engine = await get_local_engine()
              wake = await engine.synthesize('Deus.')
              question = await engine.synthesize('Quanto é dois mais dois?')
              audio = bytes(24000 * 2 * 4) + wake + bytes(24000 * 2) + question + bytes(24000 * 2 * 6)
              print(json.dumps({'access_token': access, 'origin': 'https://' + os.environ['CREATION_DOMAIN'],
                                'audio_base64': base64.b64encode(audio).decode(),
                                'minio_containers': int(os.environ['QA_MINIO_COUNT'])}))
          asyncio.run(main())
          PY
          REMOTE

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy
