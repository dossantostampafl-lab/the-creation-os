name: Security Task Force

on:
  push:
    branches: ["feat/security-task-force-runtime"]
    paths:
      - "backend/app/security_task_force/**"
      - "backend/tests/test_stf_*.py"
      - "security_gateway/**"
      - "deploy/stf/**"
      - "docker-compose.yml"
      - ".github/workflows/security-task-force.yml"
  pull_request:
    paths:
      - "backend/app/security_task_force/**"
      - "backend/tests/test_stf_*.py"
      - "security_gateway/**"
      - "deploy/stf/**"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: pip install -e './backend[dev]'
      - run: pytest backend/tests/test_stf_contracts.py backend/tests/test_stf_kill_switch.py backend/tests/test_stf_compose_invariants.py -q
      - run: ruff check backend/app/security_task_force backend/tests/test_stf_contracts.py backend/tests/test_stf_kill_switch.py backend/tests/test_stf_compose_invariants.py
  rust-gateway:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: security_gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: docker compose --profile security-task-force config --quiet
