name: Security Task Force

on:
  push:
    branches: [main]
    paths:
      - "backend/app/security_task_force/**"
      - "backend/tests/test_stf_*.py"
      - "security_gateway/**"
      - "deploy/stf/**"
      - "docker-compose.yml"
      - ".github/workflows/security-task-force.yml"
  pull_request:
    paths:
      - "backend/app/security_task_force/**"
      - "backend/tests/test_stf_*.py"
      - "security_gateway/**"
      - "deploy/stf/**"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: pip install -e './backend[dev]'
      - name: Task Force tests (Temporal test server is required here, never skipped)
        env:
          STF_REQUIRE_TEMPORAL: "1"
        # Tests marked integration need PostgreSQL; the backend job in ci.yml runs them.
        run: pytest backend/tests/test_stf_*.py -q -m "not integration"
      - run: ruff check backend/app/security_task_force backend/tests/test_stf_*.py
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Rego is well formed
        run: docker run --rm -v "$PWD/deploy/stf/opa:/policy:ro" openpolicyagent/opa:0.70.0-static check --strict /policy
      - name: Rego policy tests
        run: docker run --rm -v "$PWD/deploy/stf/opa:/policy:ro" openpolicyagent/opa:0.70.0-static test /policy -v
  rust-gateway:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: security_gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Build the exact production gateway image
        run: docker build -t creation-security-gateway-ci .
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cp .env.example .env
      - run: docker compose --profile security-task-force config --quiet
