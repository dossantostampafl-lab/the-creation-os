name: DEUS voice final gate

on:
  push:
    branches: [feat/deus-voice-latency]
    paths:
      - .github/workflows/deus-voice-final-gate.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-at-least-32-characters
      CREATOR_BOOTSTRAP_USERNAME: creator
      CREATOR_BOOTSTRAP_PASSWORD: ci-password
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_creation_os
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_creation_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --upgrade pip && pip install ".[dev]"
      - run: ruff check . ../cyber_range/controller ../cyber_range/tests
      - run: mypy app
      - name: Verify Alembic roundtrip
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0009
          python -m alembic upgrade 0010
          python -m alembic downgrade 0009
          python -m alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Start and verify stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null \
              && curl --fail --silent http://localhost:8080/healthz >/dev/null \
              && curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1
      - if: always()
        run: docker compose down -v --remove-orphans

  runtime-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validate Windows operations scripts
        shell: pwsh
        run: |
          $errors = $null
          foreach ($path in @("scripts/local-start.ps1", "scripts/local-status.ps1", "scripts/local-stop.ps1")) {
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { exit 1 }
          }
      - run: docker compose build
      - name: Verify console scripts
        shell: bash
        run: |
          for script in seed-universes create-db restore-creator; do
            output="$(docker compose run --rm --no-deps api "$script" 2>&1 || true)"
            if printf '%s' "$output" | grep -q "No module named 'app'"; then
              printf '%s\n' "$output"
              exit 1
            fi
          done

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
      - id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          upload: never
          output: ../results
      - name: Enforce local CodeQL SARIF
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          files = glob.glob("../results/*.sarif")
          if not files:
              raise SystemExit("CodeQL SARIF missing; analysis did not complete")
          blocking = []
          total = 0
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  sarif = json.load(handle)
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      total += 1
                      level = result.get("level", "warning")
                      if level in {"error", "warning"}:
                          blocking.append((level, result.get("ruleId", "unknown"), result.get("message", {}).get("text", "")))
          print(f"CodeQL local SARIF results: {total}; blocking: {len(blocking)}")
          for level, rule, message in blocking[:50]:
              print(f"{level}: {rule}: {message}")
          if blocking:
              raise SystemExit(1)
          PY

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --ignore-vuln PYSEC-2026-1325
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
