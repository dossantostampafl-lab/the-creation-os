name: Prune final superseded branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-final-superseded-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only audited branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          delete_exact_ref() {
            local branch="$1"
            local expected="$2"
            local encoded="${branch//\//%2F}"
            local actual
            actual="$(gh api "repos/$REPOSITORY/git/ref/heads/$encoded" --jq .object.sha)"
            test "$actual" = "$expected"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded"
          }
          delete_exact_ref "feat/paginated-system-surfaces" "ffd24cd5b95a8c1be61ac465ba6ea3f72cedc2d1"
          delete_exact_ref "fix/frontend-black-screen-guard" "197ba170478f3496f8df384b386ffef6d3235de6"
          delete_exact_ref "fix/frontend-session-sse-nginx" "4e11d0d569ca23789a005b83f9599f7ad22eb9cd"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/chore%2Fprune-final-superseded-branches"
