name: Align DEUS voice E2E expectations

on:
  push:
    branches: [feat/deus-voice-latency]
    paths:
      - .github/workflows/deus-voice-e2e-test-adjust.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/deus-voice-latency
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Align legacy E2E assertions with premium non-blocking acknowledgement
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/e2e/creator-console.spec.ts")
          text = path.read_text()

          marker = '''const spokenLines = (page: import("@playwright/test").Page) => page.evaluate(() => (window as unknown as { __spoken: string[] }).__spoken);\n'''
          helper = '''const spokenLines = (page: import("@playwright/test").Page) => page.evaluate(() => (window as unknown as { __spoken: string[] }).__spoken);\n\nasync function mockPremiumAcknowledgements(page: import("@playwright/test").Page, synthesized: string[]) {\n  await page.route("**/api/v1/voice/synthesize", (route) => {\n    const text = (route.request().postDataJSON() as { text: string }).text;\n    if (text === "Estou aqui." || text === "Um momento.") {\n      synthesized.push(text);\n      return route.fulfill({ status: 200, contentType: "audio/mpeg", body: Buffer.from("ID3-ack") });\n    }\n    return route.fulfill({ status: 501, contentType: "application/json", body: "{}" });\n  });\n}\n'''
          if marker not in text:
              raise SystemExit("spokenLines marker not found")
          text = text.replace(marker, helper, 1)

          old = '''test("saying “Deus” wakes DEUS, which answers and then hears the request", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  await page.route("**/api/v1/voice/synthesize", (route) => route.fulfill({ status: 501, body: "{}" }));\n  const sent: string[] = [];\n  await mockConversation(page, sent);\n\n  await page.goto("/");\n  await page.getByRole("button", { name: "Turn on “Deus” wake word" }).click();\n  await expect(page.getByText("Diga “Deus” para chamar")).toBeVisible();\n\n  await expect.poll(() => page.evaluate(() => (window as unknown as { __say: (t: string) => boolean }).__say("Deus"))).toBe(true);\n  await expect.poll(() => spokenLines(page)).toEqual(["Estou aqui."]);\n\n  await expect.poll(() => page.evaluate(() => (window as unknown as { __say: (t: string) => boolean }).__say("Status report"))).toBe(true);\n  await expect.poll(() => sent).toEqual(["Status report"]);\n  await expect.poll(() => spokenLines(page)).toEqual(["Estou aqui.", "All universes are breathing."]);\n});\n'''
          new = '''test("saying “Deus” wakes DEUS, which answers and then hears the request", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  const acknowledgements: string[] = [];\n  await mockPremiumAcknowledgements(page, acknowledgements);\n  const sent: string[] = [];\n  await mockConversation(page, sent);\n\n  await page.goto("/");\n  await page.getByRole("button", { name: "Turn on “Deus” wake word" }).click();\n  await expect(page.getByText("Diga “Deus” para chamar")).toBeVisible();\n\n  await expect.poll(() => page.evaluate(() => (window as unknown as { __say: (t: string) => boolean }).__say("Deus"))).toBe(true);\n  await expect.poll(() => acknowledgements).toEqual(["Estou aqui."]);\n  expect(await spokenLines(page)).toEqual([]);\n\n  await expect.poll(() => page.evaluate(() => (window as unknown as { __say: (t: string) => boolean }).__say("Status report"))).toBe(true);\n  await expect.poll(() => sent).toEqual(["Status report"]);\n  await expect.poll(() => spokenLines(page)).toEqual(["All universes are breathing."]);\n});\n'''
          if old not in text:
              raise SystemExit("wake legacy test not found")
          text = text.replace(old, new, 1)

          old = '''test("common transcriptions of “Deus” wake DEUS, ordinary words do not", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  await page.route("**/api/v1/voice/synthesize", (route) => route.fulfill({ status: 501, body: "{}" }));\n  const sent: string[] = [];\n'''
          new = '''test("common transcriptions of “Deus” wake DEUS, ordinary words do not", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  const acknowledgements: string[] = [];\n  await mockPremiumAcknowledgements(page, acknowledgements);\n  const sent: string[] = [];\n'''
          if old not in text:
              raise SystemExit("common transcriptions header not found")
          text = text.replace(old, new, 1)
          old = '''  await expect.poll(() => say("dê us")).toBe(true);\n  await expect.poll(() => spokenLines(page)).toEqual(["All universes are breathing.", "Até logo.", "Estou aqui."]);\n});\n'''
          new = '''  await expect.poll(() => say("dê us")).toBe(true);\n  await expect.poll(() => acknowledgements).toEqual(["Estou aqui."]);\n  await expect.poll(() => spokenLines(page)).toEqual(["All universes are breathing.", "Até logo."]);\n});\n'''
          if old not in text:
              raise SystemExit("common transcriptions footer not found")
          text = text.replace(old, new, 1)

          old = '''test("a slow answer in a voice conversation is acknowledged with “Um momento”", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  await page.route("**/api/v1/voice/synthesize", (route) => route.fulfill({ status: 501, body: "{}" }));\n  const sent: string[] = [];\n'''
          new = '''test("a slow answer in a voice conversation is acknowledged with “Um momento”", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  const acknowledgements: string[] = [];\n  await mockPremiumAcknowledgements(page, acknowledgements);\n  const sent: string[] = [];\n'''
          if old not in text:
              raise SystemExit("slow acknowledgement header not found")
          text = text.replace(old, new, 1)
          old = '''  await expect.poll(() => sent).toEqual(["como estão os universos?"]);\n  await expect.poll(() => spokenLines(page), { timeout: 10_000 })\n    .toEqual(["Um momento.", "Todos os universos estão prontos."]);\n});\n'''
          new = '''  await expect.poll(() => sent).toEqual(["como estão os universos?"]);\n  await expect.poll(() => acknowledgements, { timeout: 10_000 }).toEqual(["Um momento."]);\n  await expect.poll(() => spokenLines(page), { timeout: 10_000 })\n    .toEqual(["Todos os universos estão prontos."]);\n});\n'''
          if old not in text:
              raise SystemExit("slow acknowledgement footer not found")
          text = text.replace(old, new, 1)

          old = '''test("after “Deus” the conversation continues without the wake word until goodbye", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  await page.route("**/api/v1/voice/synthesize", (route) => route.fulfill({ status: 501, body: "{}" }));\n  const sent: string[] = [];\n'''
          new = '''test("after “Deus” the conversation continues without the wake word until goodbye", async ({ page }) => {\n  await installFakeSpeech(page);\n  await mockDashboard(page);\n  const acknowledgements: string[] = [];\n  await mockPremiumAcknowledgements(page, acknowledgements);\n  const sent: string[] = [];\n'''
          if old not in text:
              raise SystemExit("continuous conversation header not found")
          text = text.replace(old, new, 1)
          old = '''  await expect.poll(() => say("Deus")).toBe(true);\n  await expect.poll(() => spokenLines(page)).toEqual(["Estou aqui."]);\n  await expect.poll(() => say("Status report")).toBe(true);\n'''
          new = '''  await expect.poll(() => say("Deus")).toBe(true);\n  await expect.poll(() => acknowledgements).toEqual(["Estou aqui."]);\n  expect(await spokenLines(page)).toEqual([]);\n  await expect.poll(() => say("Status report")).toBe(true);\n'''
          if old not in text:
              raise SystemExit("continuous wake assertion not found")
          text = text.replace(old, new, 1)
          old = '''  await expect.poll(() => spokenLines(page)).toHaveLength(2);\n  await expect.poll(() => say("And the missions?")).toBe(true);\n'''
          new = '''  await expect.poll(() => spokenLines(page)).toHaveLength(1);\n  await expect.poll(() => say("And the missions?")).toBe(true);\n'''
          if old not in text:
              raise SystemExit("continuous first length not found")
          text = text.replace(old, new, 1)
          old = '''  await expect.poll(() => spokenLines(page)).toHaveLength(3);\n  await expect.poll(() => say("tchau")).toBe(true);\n  await expect.poll(() => spokenLines(page)).toEqual(["Estou aqui.", "All universes are breathing.", "All universes are breathing.", "Até logo."]);\n'''
          new = '''  await expect.poll(() => spokenLines(page)).toHaveLength(2);\n  await expect.poll(() => say("tchau")).toBe(true);\n  await expect.poll(() => spokenLines(page)).toEqual(["All universes are breathing.", "All universes are breathing.", "Até logo."]);\n'''
          if old not in text:
              raise SystemExit("continuous final assertions not found")
          path.write_text(text.replace(old, new, 1))
      - name: Run complete frontend verification
        run: |
          cd frontend
          npm ci
          npm run build
          npm test
          npx playwright install chromium
          npm run test:e2e
      - name: Commit tests and remove temporary workflow
        run: |
          rm .github/workflows/deus-voice-e2e-test-adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/creator-console.spec.ts .github/workflows/deus-voice-e2e-test-adjust.yml
          git commit -m "test: align DEUS acknowledgement E2E with premium voice"
          git push origin HEAD:feat/deus-voice-latency
