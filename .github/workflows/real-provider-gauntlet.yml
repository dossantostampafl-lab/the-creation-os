name: Real Provider Gauntlet

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Real inference provider to validate
        required: true
        default: openai
        type: choice
        options:
          - openai
          - freellmapi
          - openai_compatible

permissions:
  contents: read

jobs:
  real-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: real-provider-test-secret-key-at-least-32-characters
      CREATOR_BOOTSTRAP_USERNAME: creator
      CREATOR_BOOTSTRAP_PASSWORD: real-provider-test-password
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_creation_os
      REDIS_URL: redis://localhost:6379/0
      REAL_PROVIDER_TEST: "1"
      LLM_PROVIDER: ${{ inputs.provider }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
      FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      FREELLMAPI_TIMEOUT_SECONDS: "60"
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_MODEL: ${{ secrets.OPENAI_COMPATIBLE_MODEL }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_TIMEOUT_SECONDS: "60"
      EMBEDDING_PROVIDER: fake
      EMBEDDING_MODEL: fake
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_creation_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$LLM_PROVIDER" in
            openai)
              test -n "$LLM_API_KEY" || { echo "LLM_API_KEY is required for openai"; exit 1; }
              test -n "$LLM_MODEL" || { echo "LLM_MODEL is required for openai"; exit 1; }
              ;;
            freellmapi)
              test -n "$FREELLMAPI_API_KEY" || { echo "FREELLMAPI_API_KEY is required"; exit 1; }
              test -n "$FREELLMAPI_MODEL" || { echo "FREELLMAPI_MODEL is required"; exit 1; }
              test -n "$FREELLMAPI_BASE_URL" || { echo "FREELLMAPI_BASE_URL is required"; exit 1; }
              ;;
            openai_compatible)
              test -n "$OPENAI_COMPATIBLE_MODEL" || { echo "OPENAI_COMPATIBLE_MODEL is required"; exit 1; }
              test -n "$OPENAI_COMPATIBLE_BASE_URL" || { echo "OPENAI_COMPATIBLE_BASE_URL is required"; exit 1; }
              ;;
            *)
              echo "Unsupported provider: $LLM_PROVIDER"
              exit 1
              ;;
          esac
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Migrate database
        run: python -m alembic upgrade head
      - name: Run real provider golden path
        run: pytest -q tests/test_real_provider_mission.py
