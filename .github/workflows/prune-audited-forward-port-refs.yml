name: Prune audited forward-port refs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-audited-forward-port-refs.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only exact audited refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          delete_exact_ref() {
            local branch="$1"
            local expected="$2"
            local encoded="${branch//\//%2F}"
            local actual
            actual="$(gh api "repos/$REPOSITORY/git/ref/heads/$encoded" --jq .object.sha)"
            test "$actual" = "$expected"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded"
          }
          delete_exact_ref "fix/creator-interface-living-functional-scene" "523f34d34fdcbe21ccdb0350c63358a46ae496b9"
          delete_exact_ref "restore/living-functional-core-forward-port" "b6355749161376bcb7951f884ae3aaea9576576b"
          delete_exact_ref "audit/final-forward-port-retirement" "a71d592353e3da2c697ca8f084bc117f2aba7258"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/chore%2Fprune-final-forward-port-refs"
