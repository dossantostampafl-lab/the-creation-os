name: Prune merged branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-merged-branches.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Delete only verified merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            claude/quefo-riar-dashboard-1tkypb
            codex/creation-kernel-gate-a
            codex/living-operations-gate-d
            codex/living-state-gate-b
            codex/safe-autonomy-gate-c
            devin/1788477756-critical-auth-cors-fixes
            devin/1788477857-pulse-chronicles-ci
            devin/1788477944-auth-hardening
            devin/1788478384-universes-agents-memory
            devin/1790103318-restore-dual-runtime
            devin/1790104379-anthropic-provider
            devin/1790193037-devcontainer
            devin/1790194690-llm-fallback-chain
            devin/1790525779-mobile-voice-targets
            feat/canonical-project-state
            feat/cyber-range-v1-codespaces
            feat/cyber-range-v1-recovery
            feat/freellmapi-phase1
            feat/intelligence-fabric-phase2
            feat/intelligence-fabric-phase3
            feat/intelligence-fabric-phase4
            feat/intelligence-fabric-phase5
            feat/mobile-pwa-finalization-20260926
            feat/oracle-one-command-bootstrap
            feat/phase9-task1-reconciliation
            feat/security-task-force-runtime
            feat/semantic-cache-orchestrator
            fix/frontend-react-peer-resolution
            fix/oracle-cloud-dns-startup
            fix/real-provider-golden-path-gate
            integration/proto-secure-bridge
            recovery/final-sanitization
            security/pin-actions
            verify/real-provider-gauntlet
            chore/rust-build-artifacts
            ci/whole-repo-quality
            docs/oracle-runtime
            ops/prune-merged-branches
          )

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "Already absent: $branch"
              continue
            fi

            merged=false
            if git merge-base --is-ancestor "$remote_ref" origin/main; then
              merged=true
            elif [[ "$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$GITHUB_REPOSITORY_OWNER:$branch&per_page=100" \
              --jq 'any(.[]; .merged_at != null)')" == true ]]; then
              merged=true
            fi

            if [[ "$merged" != true ]]; then
              echo "Refusing to delete unmerged branch: $branch" >&2
              exit 1
            fi

            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch: $branch"
          done
