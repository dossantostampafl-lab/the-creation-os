name: Apply DEUS voice latency fixes

on:
  push:
    branches: [feat/deus-voice-latency]
    paths:
      - .github/workflows/deus-voice-latency-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/deus-voice-latency
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Apply minimal RED to GREEN patches
        shell: python
        run: |
          from pathlib import Path

          deus = Path("backend/app/services/deus.py")
          text = deus.read_text()
          old = '''# Obvious dialogue and read-only questions do not need an extra SOPHIA model call before DEUS answers.\n# Requests that contain an execution verb still go through the Trinity, even when phrased as a question.\n_ACTION_REQUEST = re.compile(\n    r"\\b(cri(?:e|ar)|fa(?:ça|ca|zer)|implement(?:e|ar)|corrij(?:a|ir)|execut(?:e|ar)|"\n    r"inici(?:e|ar)|constru(?:a|ir)|public(?:e|ar)|deploy|instal(?:e|ar)|remov(?:a|er)|"\n    r"alter(?:e|ar)|atualiz(?:e|ar)|configur(?:e|ar)|integr(?:e|ar)|automatiz(?:e|ar)|"\n    r"melhor(?:e|ar)|otimiz(?:e|ar)|adicion(?:e|ar)|modific(?:e|ar)|repar(?:e|ar)|"\n    r"reescrev(?:a|er)|prossig(?:a|uir)|continu(?:e|ar)|cancel(?:e|ar)|"\n    r"autoriz(?:e|ar)|aprov(?:e|ar))\\b",\n    re.IGNORECASE,\n)\n_DIALOGUE_OPENING = re.compile(\n    r"^\\s*(oi|olá|ola|bom dia|boa tarde|boa noite|deus\\b|status\\b|"\n    r"o que\\b|qual\\b|quais\\b|como\\b|quando\\b|onde\\b|quem\\b|"\n    r"por que\\b|porque\\b|quanto\\b|quantos\\b|me diga\\b|me explique\\b|"\n    r"explique\\b|entendeu\\b|e (isso|agora|ele|ela|eles|elas)\\b)",\n    re.IGNORECASE,\n)\n\n\ndef needs_trinity(content: str) -> bool:\n    """Keep governance for execution requests while making ordinary dialogue single-pass."""\n    normalized = " ".join(content.split())\n    if not normalized:\n        return False\n    if _ACTION_REQUEST.search(normalized):\n        return True\n    if "?" in normalized or _DIALOGUE_OPENING.search(normalized):\n        return False\n    # Ambiguous statements still go through SOPHIA rather than being guessed locally.\n    return True\n'''
          new = '''# Conversational and bounded contextual commands should stay single-pass. Governance-sensitive\n# or substantial execution requests still go through SOPHIA/ROCKMAM. Mission precedence wins.\n_MISSION_REQUEST = re.compile(\n    r"\\b(cri(?:e|ar)|fa(?:ça|ca|zer)|implement(?:e|ar)|execut(?:e|ar)|"\n    r"inici(?:e|ar)|constru(?:a|ir)|public(?:e|ar)|deploy|instal(?:e|ar)|remov(?:a|er)|"\n    r"alter(?:e|ar)|atualiz(?:e|ar)|configur(?:e|ar)|integr(?:e|ar)|automatiz(?:e|ar)|"\n    r"melhor(?:e|ar)|otimiz(?:e|ar)|adicion(?:e|ar)|modific(?:e|ar)|repar(?:e|ar)|"\n    r"reescrev(?:a|er)|cancel(?:e|ar)|autoriz(?:e|ar)|aprov(?:e|ar))\\b",\n    re.IGNORECASE,\n)\n_SIMPLE_ACTION = re.compile(\n    r"^\\s*(?:continue|prossiga|mostre|verifique|repita|abra|feche|"\n    r"corrija\\s+(?:isso|isto|esse erro|o erro))\\s*[.!?]*\\s*$",\n    re.IGNORECASE,\n)\n_DIALOGUE_OPENING = re.compile(\n    r"^\\s*(oi|olá|ola|bom dia|boa tarde|boa noite|deus\\b|status\\b|"\n    r"o que\\b|qual\\b|quais\\b|como\\b|quando\\b|onde\\b|quem\\b|"\n    r"por que\\b|porque\\b|quanto\\b|quantos\\b|me diga\\b|me explique\\b|"\n    r"explique\\b|entendeu\\b|e (isso|agora|ele|ela|eles|elas)\\b)",\n    re.IGNORECASE,\n)\n\n\ndef needs_trinity(content: str) -> bool:\n    """Route only substantial or governance-sensitive work through the full Trinity."""\n    normalized = " ".join(content.split())\n    if not normalized:\n        return False\n    if _MISSION_REQUEST.search(normalized):\n        return True\n    if _SIMPLE_ACTION.fullmatch(normalized):\n        return False\n    if "?" in normalized or _DIALOGUE_OPENING.search(normalized):\n        return False\n    # Ambiguous non-dialogue statements still fail closed into SOPHIA.\n    return True\n'''
          if old not in text:
              raise SystemExit("backend routing block not found")
          deus.write_text(text.replace(old, new, 1))

          voice = Path("frontend/src/voice.ts")
          text = voice.read_text()
          old = '''  async function maybeImproveTranscript(browserText: string, averageConfidence: number | null): Promise<string> {\n    // Confidence 0/undefined is common on Chromium and does not mean "bad". Only pay the\n    // network/STT latency when the recognizer explicitly reports low confidence.\n    if (averageConfidence === null || averageConfidence >= 0.72 || Date.now() < transcriptionRetryAt.current) {\n      void finishCapture();\n      return browserText;\n    }\n    const audio = await finishCapture();\n    if (!audio || audio.size < 400) return browserText;\n    try {\n      const improved = await transcribeVoice(audio);\n      return improved.text.trim() || browserText;\n    } catch (failure) {\n      const disabled = failure instanceof Error && failure.message === "HTTP_501";\n      transcriptionRetryAt.current = disabled ? Number.POSITIVE_INFINITY : Date.now() + 60_000;\n      return browserText;\n    }\n  }\n'''
          new = '''  async function maybeImproveTranscript(browserText: string, _averageConfidence: number | null): Promise<string> {\n    // Once DEUS is attentive, captured audio is authoritative. Chromium confidence is too\n    // inconsistent to decide whether the high-quality server STT should run.\n    const audio = await finishCapture();\n    if (!audio || audio.size < 400 || Date.now() < transcriptionRetryAt.current) return browserText;\n    try {\n      const improved = await transcribeVoice(audio);\n      return improved.text.trim() || browserText;\n    } catch (failure) {\n      const disabled = failure instanceof Error && failure.message === "HTTP_501";\n      transcriptionRetryAt.current = disabled ? Number.POSITIVE_INFINITY : Date.now() + 60_000;\n      return browserText;\n    }\n  }\n'''
          if old not in text:
              raise SystemExit("frontend STT block not found")
          voice.write_text(text.replace(old, new, 1))

          console = Path("frontend/src/CreatorConsole.tsx")
          text = console.read_text()
          old = '''    onWake: () => {\n      setConversing(true);\n      // The wake acknowledgement is part of DEUS's identity too. Use the configured\n      // ElevenLabs path instead of silently switching to an arbitrary browser voice.\n      voice.speak(voiceText.greeting(), { onEnd: () => { if (conversing.current) ears.summon(); } });\n    },\n'''
          new = '''    onWake: () => {\n      setConversing(true);\n      // Re-open capture immediately. A spoken acknowledgement must never gate the Creator's\n      // next words; preserving the first word matters more than playing a greeting.\n      ears.summon();\n    },\n'''
          if old not in text:
              raise SystemExit("wake acknowledgement block not found")
          console.write_text(text.replace(old, new, 1))
      - name: Validate targeted regressions
        run: |
          cd backend
          pip install -q -e '.[dev]'
          pytest tests/test_deus_latency_routing.py -q
          cd ../frontend
          npm ci
          npm run build
          npm test
          npx playwright install chromium
          npm run test:e2e -- --grep "server STT|wake acknowledgement"
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/deus-voice-latency-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/deus.py frontend/src/voice.ts frontend/src/CreatorConsole.tsx .github/workflows/deus-voice-latency-apply.yml
          git commit -m "fix: make DEUS voice turns low-latency"
          git push origin HEAD:feat/deus-voice-latency
