name: Apply cancellable DEUS wake acknowledgement

on:
  push:
    branches: [feat/deus-voice-latency]
    paths:
      - .github/workflows/deus-voice-ack-cancel-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/deus-voice-latency
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Make premium acknowledgement independently cancellable
        shell: python
        run: |
          from pathlib import Path

          voice = Path("frontend/src/voice.ts")
          text = voice.read_text()

          old = '''  const current = useRef<{ stop: () => void } | null>(null);\n  // Each speak() is a new turn; callbacks from an interrupted turn must not touch the current one.\n'''
          new = '''  const current = useRef<{ stop: () => void } | null>(null);\n  // Wake acknowledgements never set `speaking`, but stop() still needs an independent handle\n  // so a Creator command can cancel them without interfering with the main reply queue.\n  const acknowledgement = useRef<{ stop: () => void } | null>(null);\n  // Each speak() is a new turn; callbacks from an interrupted turn must not touch the current one.\n'''
          if old not in text:
              raise SystemExit("voice current ref anchor not found")
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => () => {\n    current.current?.stop();\n    current.current = null;\n    if (browserVoice) window.speechSynthesis.cancel();\n    voiceActivity.level = 0;\n  }, [browserVoice]);\n\n  const stop = useCallback(() => {\n    turn.current += 1;\n    current.current?.stop();\n    current.current = null;\n    if (browserVoice) window.speechSynthesis.cancel();\n    voiceActivity.level = 0;\n    setSpeaking(false);\n  }, [browserVoice]);\n'''
          new = '''  useEffect(() => () => {\n    acknowledgement.current?.stop();\n    acknowledgement.current = null;\n    current.current?.stop();\n    current.current = null;\n    if (browserVoice) window.speechSynthesis.cancel();\n    voiceActivity.level = 0;\n  }, [browserVoice]);\n\n  const stop = useCallback(() => {\n    turn.current += 1;\n    acknowledgement.current?.stop();\n    acknowledgement.current = null;\n    current.current?.stop();\n    current.current = null;\n    if (browserVoice) window.speechSynthesis.cancel();\n    voiceActivity.level = 0;\n    setSpeaking(false);\n  }, [browserVoice]);\n'''
          if old not in text:
              raise SystemExit("voice stop block not found")
          text = text.replace(old, new, 1)

          old = '''  const acknowledge = useCallback((text: string, handlers: SpeakHandlers = {}) => {\n    const content = speakable(text);\n    if (!enabledRef.current || !content) {\n      handlers.onEnd?.();\n      return;\n    }\n    // Wake acknowledgement is deliberately outside the `speaking` state. It keeps DEUS's\n    // configured voice identity while the ears remain armed for the Creator's next words.\n    const cached = phraseCache.get(content);\n    const pending = cached ? Promise.resolve(cached) : synthesizeVoice(content).then((blob) => {\n      if (content.length < 80) phraseCache.set(content, blob);\n      return blob;\n    });\n    void pending.then((blob) => {\n      const url = URL.createObjectURL(blob);\n      const audio = new Audio(url);\n      let finished = false;\n      const finish = () => {\n        if (finished) return;\n        finished = true;\n        URL.revokeObjectURL(url);\n        handlers.onEnd?.();\n      };\n      audio.onended = finish;\n      audio.onerror = finish;\n      handlers.onStart?.();\n      void audio.play().catch(finish);\n    }).catch(() => handlers.onEnd?.());\n  }, []);\n'''
          new = '''  const acknowledge = useCallback((text: string, handlers: SpeakHandlers = {}) => {\n    const content = speakable(text);\n    if (!enabledRef.current || !content) {\n      handlers.onEnd?.();\n      return;\n    }\n    // Keep the wake acknowledgement outside `speaking` so the ears stay armed, while retaining\n    // a dedicated cancellation handle. A command can therefore barge in without “Estou aqui”\n    // overlapping the command or the reply that follows.\n    acknowledgement.current?.stop();\n    const controller = new AbortController();\n    let audio: HTMLAudioElement | null = null;\n    let url = "";\n    let finished = false;\n    let handle: { stop: () => void };\n    const finish = () => {\n      if (finished) return;\n      finished = true;\n      if (url) URL.revokeObjectURL(url);\n      if (acknowledgement.current === handle) acknowledgement.current = null;\n      handlers.onEnd?.();\n    };\n    handle = {\n      stop: () => {\n        if (finished) return;\n        controller.abort();\n        audio?.pause();\n        finish();\n      },\n    };\n    acknowledgement.current = handle;\n    const cached = phraseCache.get(content);\n    const pending = cached ? Promise.resolve(cached) : synthesizeVoice(content, controller.signal).then((blob) => {\n      if (content.length < 80) phraseCache.set(content, blob);\n      return blob;\n    });\n    void pending.then((blob) => {\n      if (finished) return;\n      url = URL.createObjectURL(blob);\n      audio = new Audio(url);\n      audio.onended = finish;\n      audio.onerror = finish;\n      handlers.onStart?.();\n      void audio.play().catch(finish);\n    }).catch((failure: unknown) => {\n      if (finished || (failure instanceof DOMException && failure.name === "AbortError")) return;\n      finish();\n    });\n  }, []);\n'''
          if old not in text:
              raise SystemExit("acknowledge block not found")
          voice.write_text(text.replace(old, new, 1))

          spec = Path("frontend/e2e/deus-voice-latency.spec.ts")
          test = spec.read_text()
          old = '''    HTMLMediaElement.prototype.play = function play() {\n      scope.__audioPlaying = true;\n      return Promise.resolve();\n    };\n    HTMLMediaElement.prototype.pause = function pause() {\n      scope.__audioPauses = (scope.__audioPauses ?? 0) + 1;\n    };\n'''
          new = '''    class FakeAudio {\n      onended: (() => void) | null = null;\n      onerror: (() => void) | null = null;\n      paused = true;\n      constructor(_src?: string) {}\n      play() {\n        this.paused = false;\n        scope.__audioPlaying = true;\n        return Promise.resolve();\n      }\n      pause() {\n        this.paused = true;\n        scope.__audioPauses = (scope.__audioPauses ?? 0) + 1;\n      }\n    }\n    Object.defineProperty(window, "Audio", { configurable: true, value: FakeAudio });\n'''
          if old not in test:
              raise SystemExit("fake audio block not found")
          spec.write_text(test.replace(old, new, 1))
      - name: Verify targeted GREEN and complete frontend suite
        run: |
          cd frontend
          npm ci
          npm run build
          npm test
          npx playwright install chromium
          npm run test:e2e
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/deus-voice-ack-cancel-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/voice.ts frontend/e2e/deus-voice-latency.spec.ts .github/workflows/deus-voice-ack-cancel-fix.yml
          git commit -m "fix: cancel wake acknowledgement on Creator barge-in"
          git push origin HEAD:feat/deus-voice-latency
