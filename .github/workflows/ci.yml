name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-at-least-32-characters
      CREATOR_BOOTSTRAP_USERNAME: creator
      CREATOR_BOOTSTRAP_PASSWORD: ci-password
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_creation_os
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_creation_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: python -m alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure canonical development environment
        run: cp .env.example .env
      - name: Validate complete local Compose configuration
        run: docker compose config --quiet
      - name: Start complete local stack
        run: docker compose up -d --build
      - name: Verify API and frontend proxy readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null \
              && curl --fail --silent http://localhost:8080/healthz >/dev/null \
              && curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Stop complete local stack
        if: always()
        run: docker compose down -v --remove-orphans

  release:
    runs-on: ubuntu-latest
    env:
      APP_SECRET_KEY: ci-release-secret-key-at-least-32-characters
      CREATOR_BOOTSTRAP_USERNAME: creator
      CREATOR_BOOTSTRAP_PASSWORD: ci-release-password
      POSTGRES_PASSWORD: ci@strong/pass?word
      DATABASE_URL: postgresql+asyncpg://creation:ci%40strong%2Fpass%3Fword@postgres:5432/the_creation_os
      LLM_PROVIDER: openai
      LLM_MODEL: ci-model
      LLM_API_KEY: ci-not-a-real-key
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ci-embedding-model
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAI production configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate FreeLLMAPI production configuration
        env:
          LLM_PROVIDER: freellmapi
          FREELLMAPI_API_KEY: ci-not-a-real-key
          FREELLMAPI_MODEL: ci-freellm-model
          FREELLMAPI_BASE_URL: https://freellm.example.invalid/v1
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate OpenAI-compatible production configuration
        env:
          LLM_PROVIDER: openai_compatible
          OPENAI_COMPATIBLE_MODEL: ci-compatible-model
          OPENAI_COMPATIBLE_BASE_URL: https://compatible.example.invalid/v1
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate Render Blueprint YAML
        run: ruby -e 'require "yaml"; data = YAML.safe_load_file("render.yaml"); abort("missing services") unless data["services"].is_a?(Array); abort("missing databases") unless data["databases"].is_a?(Array)'
      - name: Validate Render deployment invariants
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-secret-key-at-least-32-characters
          CREATOR_BOOTSTRAP_USERNAME: creator
          CREATOR_BOOTSTRAP_PASSWORD: ci-password
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_creation_os
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pytest -q tests/test_render_deployment_invariants.py tests/test_render_database_url.py
      - run: docker build -t creation-api:ci ./backend
      - run: docker build -t creation-frontend:ci ./frontend
      - name: Build Render frontend image
        run: docker build -f frontend/Dockerfile.render --build-arg VITE_API_BASE_URL=https://example.invalid/api/v1 -t creation-frontend-render:ci frontend
