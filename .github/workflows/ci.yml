name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-at-least-32-characters
      CREATOR_BOOTSTRAP_USERNAME: creator
      CREATOR_BOOTSTRAP_PASSWORD: ci-password
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/the_creation_os
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_creation_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          if ! ruff check .; then
            echo "::group::Ruff suggested fixes"
            ruff check --diff . || true
            echo "::endgroup::"
            exit 1
          fi
      - run: mypy app
      - run: python -m alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure canonical development environment
        run: cp .env.example .env
      - name: Validate complete local Compose configuration
        run: docker compose config --quiet
      - name: Start complete local stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose up -d --build; then
            docker compose ps --all
            docker compose logs --no-color
            exit 1
          fi
      - name: Verify API and frontend proxy readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null \
              && curl --fail --silent http://localhost:8080/healthz >/dev/null \
              && curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1
      - name: Stop complete local stack
        if: always()
        run: docker compose down -v --remove-orphans

  release:
    name: runtime-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate canonical local LAN Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Windows operations scripts
        shell: pwsh
        run: |
          $errors = $null
          foreach ($path in @("scripts/local-start.ps1", "scripts/local-status.ps1", "scripts/local-stop.ps1")) {
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Validate hardened production Compose
        env:
          APP_SECRET_KEY: ci-secret-key-at-least-32-characters
          CREATOR_BOOTSTRAP_USERNAME: creator
          CREATOR_BOOTSTRAP_PASSWORD: ci-password
          DATABASE_URL: postgresql+asyncpg://creation:ci-password@postgres:5432/the_creation_os
          POSTGRES_PASSWORD: ci-password
          LLM_PROVIDER: openai
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate Render blueprint
        run: python -c "import yaml; yaml.safe_load(open('render.yaml'))"
      - name: Build canonical local runtime
        run: docker compose build
      - name: Build Render frontend image
        run: docker build -f frontend/Dockerfile.render --build-arg VITE_API_BASE_URL=https://example.invalid/api/v1 frontend
