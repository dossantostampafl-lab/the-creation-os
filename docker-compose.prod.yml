services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${CREATION_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    networks:
      - edge

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &app_environment
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      CREATOR_BOOTSTRAP_USERNAME: ${CREATOR_BOOTSTRAP_USERNAME:?CREATOR_BOOTSTRAP_USERNAME is required}
      CREATOR_BOOTSTRAP_PASSWORD: ${CREATOR_BOOTSTRAP_PASSWORD:?CREATOR_BOOTSTRAP_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-}
      FREELLMAPI_TIMEOUT_SECONDS: ${FREELLMAPI_TIMEOUT_SECONDS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-60}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-4096}
      TRINITY_ENABLED: ${TRINITY_ENABLED:-true}
      TRINITY_MIN_CONFIDENCE: ${TRINITY_MIN_CONFIDENCE:-0.7}
      ELEVENLABS_ENABLED: ${ELEVENLABS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-NFmEzNOony1UsEJGXLth}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-12}
      VOICE_SYNTHESIS_MAX_CHARS: ${VOICE_SYNTHESIS_MAX_CHARS:-1200}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_TIMEOUT_SECONDS: ${OPENAI_COMPATIBLE_TIMEOUT_SECONDS:-60}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?EMBEDDING_PROVIDER is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      SEMANTIC_CACHE_MODE: ${SEMANTIC_CACHE_MODE:-shadow}
      SEMANTIC_CACHE_POLICY_VERSION: ${SEMANTIC_CACHE_POLICY_VERSION:-sc-v1}
      SEMANTIC_CACHE_EMBEDDING_VERSION: ${SEMANTIC_CACHE_EMBEDDING_VERSION:-v1}
      SEMANTIC_CACHE_REDIS_PREFIX: ${SEMANTIC_CACHE_REDIS_PREFIX:-tco:semantic-cache}
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${SEMANTIC_CACHE_SIMILARITY_THRESHOLD:-0.94}
      SEMANTIC_CACHE_REVALIDATE_THRESHOLD: ${SEMANTIC_CACHE_REVALIDATE_THRESHOLD:-0.90}
      SEMANTIC_CACHE_MAX_CANDIDATES: ${SEMANTIC_CACHE_MAX_CANDIDATES:-5}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-86400}
      SEMANTIC_CACHE_DOCUMENT_TTL_SECONDS: ${SEMANTIC_CACHE_DOCUMENT_TTL_SECONDS:-3600}
      SEMANTIC_CACHE_DETERMINISTIC_TTL_SECONDS: ${SEMANTIC_CACHE_DETERMINISTIC_TTL_SECONDS:-3600}
      SEMANTIC_CACHE_LOCK_SECONDS: ${SEMANTIC_CACHE_LOCK_SECONDS:-30}
      SEMANTIC_CACHE_SINGLEFLIGHT_WAIT_MS: ${SEMANTIC_CACHE_SINGLEFLIGHT_WAIT_MS:-250}
      PROTO_BASE_URL: ${PROTO_BASE_URL:-}
      PROTO_CREATION_SHARED_SECRET: ${PROTO_CREATION_SHARED_SECRET:-}
      PROTO_TIMEOUT_SECONDS: ${PROTO_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *app_environment
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
      - internal

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: creation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: the_creation_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creation -d the_creation_os"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
