services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "0.0.0.0:${CREATION_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tco_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: &local_bridge
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/var/lib/creation/workspaces}
      PROTO_BASE_URL: ${PROTO_BASE_URL:-}
      PROTO_CREATION_SHARED_SECRET: ${PROTO_CREATION_SHARED_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CREATION_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: the_creation_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *local_bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    volumes:
      - workspace_data:${WORKSPACE_ROOT:-/var/lib/creation/workspaces}
    restart: unless-stopped
    networks:
      - tco_net

  stf-nats:
    image: nats:2.10-alpine
    profiles: ["security-task-force"]
    command: ["-js", "-sd", "/data"]
    volumes:
      - stf_nats_data:/data
    networks: [stf-control]
    restart: unless-stopped

  stf-opa:
    image: openpolicyagent/opa:0.70.0-static
    profiles: ["security-task-force"]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/stf.rego"]
    volumes:
      - ./deploy/stf/opa:/policy:ro
    networks: [stf-control]
    restart: unless-stopped

  stf-temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: ["security-task-force"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tco_net, stf-control]
    restart: unless-stopped

  stf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["security-task-force"]
    env_file: [.env]
    environment:
      TEMPORAL_ADDRESS: stf-temporal:7233
      NATS_URL: nats://stf-nats:4222
      OPA_URL: http://stf-opa:8181
    command: ["python", "-m", "app.security_task_force.temporal_worker"]
    depends_on: [stf-temporal, stf-nats, stf-opa]
    networks: [stf-control]
    restart: unless-stopped

  stf-gateway:
    build:
      context: ./security_gateway
    profiles: ["security-task-force"]
    networks: [stf-control, stf-execution]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  workspace_data:
  stf_nats_data:

networks:
  tco_net:
    driver: bridge
  stf-control:
    driver: bridge
    internal: true
  stf-execution:
    driver: bridge
    internal: true
