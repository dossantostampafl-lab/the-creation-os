x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
  CREATOR_BOOTSTRAP_USERNAME: ${CREATOR_BOOTSTRAP_USERNAME:-creator}
  CREATOR_BOOTSTRAP_PASSWORD_FILE: /run/secrets/creator_bootstrap_password
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-fake}
  LLM_API_KEY_FILE: /run/secrets/llm_api_key
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake}
  GITHUB_TOKEN_FILE: /run/secrets/github_token
  WORKER_CREDENTIAL_FILE: /run/secrets/worker_credential
  ELEVENLABS_ENABLED: ${ELEVENLABS_ENABLED:-false}
  ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-configured-voice-id}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
  ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-12}
  VOICE_SYNTHESIS_MAX_CHARS: ${VOICE_SYNTHESIS_MAX_CHARS:-1200}

x-backend-secrets: &backend-secrets
  - app_secret_key
  - creator_bootstrap_password
  - database_url
  - elevenlabs_api_key
  - github_token
  - llm_api_key
  - worker_credential

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    secrets: *backend-secrets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tco_net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-the_creation_os}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tco_net

  # Test-only Postgres, isolated from the "postgres" service above (separate
  # image instance, separate named volume, separate port). Data here is
  # disposable and fully recreated per test session (conftest.py's
  # session-scoped `alembic upgrade head` fixture) — never used for
  # dev/prod data — so it is safe to trade durability for speed:
  # fsync/synchronous_commit/full_page_writes=off skip the WAL fsync each
  # TRUNCATE/commit would otherwise wait on. See ARCHITECTURE.md, "Lote:
  # Investigação da lentidão da suíte" for the measured raw-disk evidence
  # (a `dd ... oflag=dsync` fsync benchmark took ~300ms per write on this
  # Docker Desktop/WSL2 host) that motivated this, and never apply these
  # flags to the "postgres" service above.
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: the_creation_os_test
    secrets:
      - postgres_password
    command:
      [
        "postgres",
        "-c", "fsync=off",
        "-c", "synchronous_commit=off",
        "-c", "full_page_writes=off",
      ]
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tco_net
    profiles:
      - test

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tco_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
        VITE_CREATOR_DEFAULT_USERNAME: ${VITE_CREATOR_DEFAULT_USERNAME:-creator}
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tco_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tco_net

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:

networks:
  tco_net:
    driver: bridge

secrets:
  app_secret_key:
    file: ./secrets/app_secret_key.txt
  creator_bootstrap_password:
    file: ./secrets/creator_bootstrap_password.txt
  database_url:
    file: ./secrets/database_url.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  elevenlabs_api_key:
    file: ./secrets/elevenlabs_api_key.txt
  github_token:
    file: ./secrets/github_token.txt
  llm_api_key:
    file: ./secrets/llm_api_key.txt
  worker_credential:
    file: ./secrets/worker_credential.txt
