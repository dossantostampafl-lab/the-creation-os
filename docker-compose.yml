services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "0.0.0.0:${CREATION_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tco_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: &local_bridge
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/var/lib/creation/workspaces}
      PROTO_BASE_URL: ${PROTO_BASE_URL:-}
      PROTO_CREATION_SHARED_SECRET: ${PROTO_CREATION_SHARED_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Compiled Task Force contracts, grants and kill switch: shared with stf-worker so a revoke
      # or a cancel made through the API is seen by the worker.
      - ./releases:/var/lib/creation/releases:ro
      - stf_state:/var/lib/creation/stf
      - voice_models:/var/lib/creation/voice
      - deus_diagnostics:/var/lib/creation/diagnostics
      - deus_obsidian:/var/lib/creation/obsidian
    ports:
      - "127.0.0.1:${CREATION_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: the_creation_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tco_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *local_bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    volumes:
      - workspace_data:${WORKSPACE_ROOT:-/var/lib/creation/workspaces}
    restart: unless-stopped
    networks:
      - tco_net

  stf-nats:
    image: nats:2.10-alpine
    profiles: ["security-task-force"]
    command: ["-js", "-sd", "/data"]
    volumes:
      - stf_nats_data:/data
    networks: [stf-control]
    restart: unless-stopped

  stf-opa:
    image: openpolicyagent/opa:0.70.0-static
    profiles: ["security-task-force"]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/stf.rego"]
    volumes:
      - ./deploy/stf/opa:/policy:ro
    networks: [stf-control]
    restart: unless-stopped

  stf-temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: ["security-task-force"]
    environment:
      # Docker DNS may select either private interface. auto-setup otherwise
      # binds only one hostname address, rejecting clients on the other network.
      # No host ports are published for this service.
      BIND_ON_IP: 0.0.0.0
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tco_net, stf-control]
    restart: unless-stopped

  stf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["security-task-force"]
    env_file: [.env]
    environment:
      TEMPORAL_ADDRESS: stf-temporal:7233
      NATS_URL: nats://stf-nats:4222
      OPA_URL: http://stf-opa:8181
      STF_STATE_DIR: /var/lib/creation/stf
    volumes:
      - stf_state:/var/lib/creation/stf
    command: ["python", "-m", "app.security_task_force.temporal_worker"]
    depends_on: [stf-temporal, stf-nats, stf-opa]
    # temporal_worker dispatches the durable DB outbox; it needs both the
    # private STF control plane and PostgreSQL on tco_net.
    networks: [tco_net, stf-control]
    restart: unless-stopped

  stf-training-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["security-task-force"]
    env_file: [.env]
    environment:
      STF_AUTO_TRAINING_ENABLED: ${STF_AUTO_TRAINING_ENABLED:-false}
      STF_AUTO_TRAINING_CYCLE_SECONDS: ${STF_AUTO_TRAINING_CYCLE_SECONDS:-60}
    command: ["python", "-m", "app.security_task_force.training_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      stf-temporal:
        condition: service_started
      stf-worker:
        condition: service_started
    networks: [tco_net, stf-control]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  stf-gateway:
    build:
      context: ./security_gateway
    profiles: ["security-task-force"]
    environment:
      STF_GATEWAY_SIGNING_KEY: ${STF_GATEWAY_SIGNING_KEY:-}
      STF_SANDBOX_BACKEND: ${STF_SANDBOX_BACKEND:-auto}
      STF_ALLOWED_ENVIRONMENTS: ${STF_ALLOWED_ENVIRONMENTS:-cyber_range:}
      STF_GATEWAY_STATE_DIR: /var/lib/stf-gateway
      CYBER_RANGE_CONTROL_ADDR: ${CYBER_RANGE_CONTROL_ADDR:-}
      CYBER_RANGE_CONTROL_TOKEN: ${CYBER_RANGE_CONTROL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stf_gateway_data:/var/lib/stf-gateway
    networks: [stf-control, stf-execution]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Optional, read-only telemetry for the Security Task Force: docker logs -> Promtail -> Loki -> Grafana.
  # No Docker socket is mounted; Promtail only reads container log files, read-only. Grafana is the only
  # published port and is bound to loopback.
  stf-loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - stf_loki_data:/loki
    networks: [obs-backend]
    restart: unless-stopped

  stf-promtail:
    image: grafana/promtail:3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/observability/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - stf_promtail_positions:/positions
    depends_on: [stf-loki]
    networks: [obs-backend]
    restart: unless-stopped

  stf-grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${STF_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - stf_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${STF_GRAFANA_PORT:-3001}:3000"
    depends_on: [stf-loki]
    networks: [obs-backend, obs-frontend]
    restart: unless-stopped

  knowledge-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
    - connected-deus
    environment: &observer_environment
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: observer-no-auth-server-unused-key-32chars
      CREATOR_BOOTSTRAP_USERNAME: observer-not-a-login
      CREATOR_BOOTSTRAP_PASSWORD: observer-no-bootstrap-unused-password
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SOVEREIGN_CREATOR_ID: ${SOVEREIGN_CREATOR_ID:-}
      DEUS_DIAGNOSTICS_ENABLED: ${DEUS_DIAGNOSTICS_ENABLED:-false}
      DEUS_DIAGNOSTICS_TASK_STALL_SECONDS: ${DEUS_DIAGNOSTICS_TASK_STALL_SECONDS:-900}
      DEUS_DIAGNOSTICS_PROJECTION_MAX_LAG: ${DEUS_DIAGNOSTICS_PROJECTION_MAX_LAG:-100}
      DEUS_AUTONOMY_DISCOVERY_ENABLED: ${DEUS_AUTONOMY_DISCOVERY_ENABLED:-false}
      STF_AUTO_TRAINING_ENABLED: ${STF_AUTO_TRAINING_ENABLED:-false}
      DEUS_OBSIDIAN_EXPORT_ENABLED: ${DEUS_OBSIDIAN_EXPORT_ENABLED:-false}
      DEUS_VOICE_SESSION_ENABLED: ${DEUS_VOICE_SESSION_ENABLED:-false}
      DEUS_LOCAL_VOICE_MODELS_DIR: ${DEUS_LOCAL_VOICE_MODELS_DIR:-/var/lib/creation/voice}
    command:
    - python
    - -m
    - app.knowledge.worker
    depends_on:
      api:
        condition: service_healthy
    volumes:
    - deus_diagnostics:/var/lib/creation/diagnostics
    - deus_obsidian:/var/lib/creation/obsidian
    restart: unless-stopped
    networks:
    - tco_net
    security_opt:
    - no-new-privileges:true
  diagnostics-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
    - connected-deus
    environment: *observer_environment
    command:
    - python
    - -m
    - app.diagnostics.worker
    depends_on:
      api:
        condition: service_healthy
    volumes:
    - deus_diagnostics:/var/lib/creation/diagnostics
    - deus_obsidian:/var/lib/creation/obsidian
    - voice_models:/var/lib/creation/voice:ro
    restart: unless-stopped
    networks:
    - tco_net
    security_opt:
    - no-new-privileges:true
  discovery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
    - connected-deus
    environment:
      <<: *observer_environment
      PERCEPTION_SENSOR_BINDINGS_JSON: ${PERCEPTION_SENSOR_BINDINGS_JSON:-{"web.search":{"capability":"web","action":"search"}}}
      PERCEPTION_SENSOR_ALLOWLIST: ${PERCEPTION_SENSOR_ALLOWLIST:-web.search}
      PERCEPTION_MAX_SENSORS_PER_CYCLE: ${PERCEPTION_MAX_SENSORS_PER_CYCLE:-4}
      MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-[]}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
      WEB_CAPABILITY_ENABLED: ${WEB_CAPABILITY_ENABLED:-true}
      WEB_TIMEOUT_SECONDS: ${WEB_TIMEOUT_SECONDS:-15}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-500000}
      WEB_PROVIDER_PREFERENCE: ${WEB_PROVIDER_PREFERENCE:-}
      WEB_CRAWLEE_ENDPOINT: ${WEB_CRAWLEE_ENDPOINT:-}
      WEB_CRAWL4AI_ENDPOINT: ${WEB_CRAWL4AI_ENDPOINT:-}
      WEB_FIRECRAWL_ENDPOINT: ${WEB_FIRECRAWL_ENDPOINT:-}
      WEB_FIRECRAWL_API_KEY: ${WEB_FIRECRAWL_API_KEY:-}
      WEB_EXA_ENDPOINT: ${WEB_EXA_ENDPOINT:-}
      WEB_EXA_API_KEY: ${WEB_EXA_API_KEY:-}
      WEB_TAVILY_ENDPOINT: ${WEB_TAVILY_ENDPOINT:-}
      WEB_TAVILY_API_KEY: ${WEB_TAVILY_API_KEY:-}
      WEB_BRAVE_ENDPOINT: ${WEB_BRAVE_ENDPOINT:-}
      WEB_BRAVE_API_KEY: ${WEB_BRAVE_API_KEY:-}
      WEB_APIFY_ENDPOINT: ${WEB_APIFY_ENDPOINT:-}
      WEB_APIFY_API_KEY: ${WEB_APIFY_API_KEY:-}
      WEB_REMOTE_SECURITY_REVIEW: ${WEB_REMOTE_SECURITY_REVIEW:-pending}
      WEB_REMOTE_SHADOW_ENABLED: ${WEB_REMOTE_SHADOW_ENABLED:-true}
      WEB_REMOTE_PRODUCTION_ENABLED: ${WEB_REMOTE_PRODUCTION_ENABLED:-false}
    command:
    - python
    - -m
    - app.autonomy.discovery
    depends_on:
      api:
        condition: service_healthy
    volumes:
    - deus_diagnostics:/var/lib/creation/diagnostics
    - deus_obsidian:/var/lib/creation/obsidian
    restart: unless-stopped
    networks:
    - tco_net
    security_opt:
    - no-new-privileges:true


  opportunity-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
    - connected-deus
    environment:
      <<: *observer_environment
      DEUS_AUTONOMY_COMPETITION_ENABLED: ${DEUS_AUTONOMY_COMPETITION_ENABLED:-false}
      OPPORTUNITY_COMPETITOR_LIMIT: ${OPPORTUNITY_COMPETITOR_LIMIT:-3}
      OPPORTUNITY_COMPOSITION_ENABLED: ${OPPORTUNITY_COMPOSITION_ENABLED:-true}
      OPPORTUNITY_MAX_PER_CYCLE: ${OPPORTUNITY_MAX_PER_CYCLE:-2}
      OPPORTUNITY_RESEARCH_LEASE_SECONDS: ${OPPORTUNITY_RESEARCH_LEASE_SECONDS:-600}
      OPPORTUNITY_EXECUTIVE_LEASE_SECONDS: ${OPPORTUNITY_EXECUTIVE_LEASE_SECONDS:-1800}
      OPPORTUNITY_STALE_CLAIM_SECONDS: ${OPPORTUNITY_STALE_CLAIM_SECONDS:-900}
      OPPORTUNITY_COMPETITION_CYCLE_SECONDS: ${OPPORTUNITY_COMPETITION_CYCLE_SECONDS:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-freellmapi}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-60}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-4096}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://host.docker.internal:3001/v1}
      FREELLMAPI_TIMEOUT_SECONDS: ${FREELLMAPI_TIMEOUT_SECONDS:-60}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_COMPATIBLE_TIMEOUT_SECONDS: ${OPENAI_COMPATIBLE_TIMEOUT_SECONDS:-60}
    extra_hosts:
    - "host.docker.internal:host-gateway"
    command:
    - python
    - -m
    - app.autonomy.competition
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - tco_net
    security_opt:
    - no-new-privileges:true

volumes:
  deus_diagnostics:
  deus_obsidian:
  voice_models:
  postgres_data:
  redis_data:
  workspace_data:
  stf_nats_data:
  stf_gateway_data:
  stf_state:
  stf_loki_data:
  stf_promtail_positions:
  stf_grafana_data:

networks:
  tco_net:
    driver: bridge
  stf-control:
    driver: bridge
    internal: true
  stf-execution:
    driver: bridge
    internal: true
  obs-backend:
    driver: bridge
    internal: true
  obs-frontend:
    driver: bridge
