global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: creation-otel
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: infrastructure
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
