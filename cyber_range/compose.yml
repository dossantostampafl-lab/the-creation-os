name: creation-cyber-range

services:
  controller:
    build:
      context: ./controller
    profiles: ["cyber-range"]
    environment:
      RANGE_SCENARIO_CATALOG: /app/scenarios/catalog.json
      RANGE_EVIDENCE_DIR: /evidence
      RANGE_STATE_DIR: /state
      RANGE_SNAPSHOT_DIR: /snapshots
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - ./scenarios:/app/scenarios:ro
      - ./evidence:/evidence
      - range_state:/state
      - range_snapshots:/snapshots
    networks:
      - range_control
      - range_targets
      - range_loopback
    read_only: true
    tmpfs:
      - /tmp
      - /home/range
    security_opt:
      - no-new-privileges:true

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["cyber-range"]
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - range_targets
      - range_loopback
    security_opt:
      - no-new-privileges:true

  webgoat:
    image: webgoat/webgoat:latest
    profiles: ["cyber-range"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    networks:
      - range_targets
      - range_loopback
    security_opt:
      - no-new-privileges:true

networks:
  # Range traffic between the controller and the targets. Nothing here reaches anything else.
  range_control:
    internal: true
  range_targets:
    internal: true
  # The only network the published loopback ports can be reached through: Docker maps no host
  # port for a container whose networks are all internal, so the range was unreachable from the
  # machine running it. Masquerading is off, which is what internal was there to guarantee —
  # there is no NAT, so a container on this network still has no route to the internet or the
  # LAN, and the targets stay published on 127.0.0.1 only.
  range_loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  range_state:
  range_snapshots:
