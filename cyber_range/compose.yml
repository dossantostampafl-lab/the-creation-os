name: creation-cyber-range

services:
  controller:
    build:
      context: ./controller
    profiles: ["cyber-range"]
    environment:
      RANGE_SCENARIO_CATALOG: /app/scenarios/catalog.json
      RANGE_EVIDENCE_DIR: /evidence
      RANGE_STATE_DIR: /state
      RANGE_SNAPSHOT_DIR: /snapshots
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - ./scenarios:/app/scenarios:ro
      - range_evidence:/evidence
      - range_state:/state
      - range_snapshots:/snapshots
    networks:
      - range_control
      - range_targets
      - range_loopback
    read_only: true
    tmpfs:
      - /tmp
      - /home/range
    security_opt:
      - no-new-privileges:true

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["cyber-range"]
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - range_targets
      - range_loopback
    security_opt:
      - no-new-privileges:true

  webgoat:
    image: webgoat/webgoat:latest
    profiles: ["cyber-range"]
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:9090:9090"
    networks:
      - range_targets
      - range_loopback
    security_opt:
      - no-new-privileges:true

networks:
  # Range traffic between the controller and the targets. Nothing here reaches anything else.
  range_control:
    internal: true
  range_targets:
    internal: true
  # Loopback publication requires a non-internal bridge on this Docker topology.
  # NAT is disabled, but this is not a firewall against host or routed destinations.
  # Run on a dedicated/disposable host; see README safety boundary before deployment.
  range_loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  range_state:
  range_snapshots:
  range_evidence:
